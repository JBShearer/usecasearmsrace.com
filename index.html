<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Use Case Arms Race · Build the case for AI</title>
<meta name="description" content="A public docket of AI deployments. Every use case is a case. Every news article is evidence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   UCAR 5.0 - MOBILE-FIRST RESPONSIVE UI
   Built: 2026-07-24
   Design: Legal docket aesthetic with full mobile support
   Minimum: 320px width, 14px body text, 44px touch targets
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  /* Colors - Light theme (GOOD) */
  --paper: #F5F1E6;
  --ink: #141210;
  --stamp: #C0221C;
  --olive: #565442;
  --line: #C9C2AE;
  --good: #2E6B3F;
  --evil: #8B0000;
  --card: #fff;
  --case-bg: #FFFEF8;
  --case-tab: #D4A84C;
  --article-bg: #fff;

  /* Typography scale (rem-based, 16px base) */
  --text-xs: 0.75rem;    /* 12px - minimum for labels */
  --text-sm: 0.875rem;   /* 14px - body text */
  --text-base: 1rem;     /* 16px - standard */
  --text-lg: 1.125rem;   /* 18px - subheadings */
  --text-xl: 1.25rem;    /* 20px - headings */
  --text-2xl: 1.5rem;    /* 24px - large headings */
  --text-3xl: 1.875rem;  /* 30px - hero */

  /* Spacing scale */
  --space-1: 0.25rem;    /* 4px */
  --space-2: 0.5rem;     /* 8px */
  --space-3: 0.75rem;    /* 12px */
  --space-4: 1rem;       /* 16px */
  --space-5: 1.25rem;    /* 20px */
  --space-6: 1.5rem;     /* 24px */
  --space-8: 2rem;       /* 32px */
  --space-12: 3rem;      /* 48px */

  /* Touch targets */
  --tap-min: 44px;       /* iOS minimum */
  --tap-comfortable: 48px;

  /* Responsive font size (base) */
  font-size: 16px;
}

/* Dark theme (EVIL) */
[data-theme="dark"] {
  --paper: #141210;
  --ink: #E8E4DC;
  --stamp: #E85A4F;
  --olive: #A8A090;
  --line: #3A3632;
  --good: #4CAF50;
  --evil: #FF6B6B;
  --card: #1E1C18;
  --case-bg: #1A1815;
  --case-tab: #B8860B;
  --article-bg: #1E1C18;
}

/* Scale up fonts on larger viewports */
@media (min-width: 640px) {
  :root { font-size: 17px; }
}

@media (min-width: 1024px) {
  :root { font-size: 18px; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   BASE STYLES - MOBILE FIRST
   ═══════════════════════════════════════════════════════════════════════════ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Archivo', sans-serif;
  font-size: var(--text-sm);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Typography utilities */
.mono {
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-xs);
  letter-spacing: 0.02em;
}

.disp {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* ═══════════════════════════════════════════════════════════════════════════
   HEADER - STACKS ON MOBILE, HORIZONTAL ON TABLET+
   ═══════════════════════════════════════════════════════════════════════════ */

header {
  border-bottom: 3px solid var(--ink);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

@media (min-width: 640px) {
  header {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
  }
}

.brand {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

header h1 {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: var(--text-xl);
  letter-spacing: 0.04em;
  line-height: 1.2;
}

@media (min-width: 640px) {
  header h1 {
    font-size: var(--text-2xl);
  }
}

header h1 span {
  color: var(--stamp);
}

header .tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-xs);
  color: var(--olive);
  line-height: 1.4;
}

/* Header buttons - 44px minimum tap target */
.hdr-btns {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.hdr-btn {
  background: none;
  border: 2px solid var(--ink);
  color: var(--ink);
  padding: var(--space-3) var(--space-4);
  min-height: var(--tap-min);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: var(--text-sm);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.hdr-btn:hover,
.hdr-btn:focus {
  background: var(--ink);
  color: var(--paper);
  outline: none;
}

.hdr-btn.tab.on {
  background: var(--ink);
  color: var(--paper);
}

.hdr-btn.admin {
  border-color: var(--stamp);
  color: var(--stamp);
}

.hdr-btn.admin:hover {
  background: var(--stamp);
  color: #fff;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
   ═══════════════════════════════════════════════════════════════════════════ */

main {
  max-width: 100%;
  margin: 0 auto;
  padding: var(--space-4);
}

@media (min-width: 640px) {
  main {
    max-width: 720px;
    padding: var(--space-6);
  }
}

@media (min-width: 1024px) {
  main {
    max-width: 960px;
    padding: var(--space-8);
  }
}

@media (min-width: 1280px) {
  main {
    max-width: 1200px;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SEARCH & FILTERS - MOBILE-FIRST LAYOUT
   ═══════════════════════════════════════════════════════════════════════════ */

#controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

@media (min-width: 640px) {
  #controls {
    flex-direction: row;
    align-items: center;
  }
}

#q {
  flex: 1;
  min-width: 0;
  border: 2px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  padding: var(--space-3);
  min-height: var(--tap-min);
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-sm);
  border-radius: 0;
  -webkit-appearance: none;
}

#q:focus {
  outline: 3px solid var(--stamp);
  outline-offset: 1px;
}

/* Filter section - stacks on mobile */
#filterSection {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

@media (min-width: 640px) {
  #filterSection {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
}

.filter-popup-btn {
  background: var(--card);
  border: 2px solid var(--ink);
  padding: var(--space-3) var(--space-4);
  min-height: var(--tap-min);
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: var(--text-sm);
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  position: relative;
  box-shadow: 2px 2px 0 var(--ink);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.filter-popup-btn:hover {
  background: var(--paper);
}

.filter-popup-btn.active {
  background: var(--ink);
  color: var(--paper);
}

.filter-popup-btn .badge {
  background: var(--stamp);
  color: #fff;
  font-size: var(--text-xs);
  padding: var(--space-1) var(--space-2);
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

/* Time filters */
.time-filter {
  background: var(--card);
  border: 2px solid var(--line);
  padding: var(--space-3) var(--space-4);
  min-height: var(--tap-min);
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: var(--text-sm);
  letter-spacing: 0.05em;
  box-shadow: 2px 2px 0 var(--line);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.time-filter:hover {
  border-color: var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}

.time-filter.on {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* Sort controls - stacks on mobile, inline on tablet+ */
#sortBar {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

@media (min-width: 640px) {
  #sortBar {
    flex-direction: row;
    align-items: center;
    margin-top: 0;
    margin-left: auto;
  }
}

.sort-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-xs);
  color: var(--olive);
}

.sort-btn {
  background: none;
  border: 2px solid var(--line);
  padding: var(--space-2) var(--space-3);
  min-height: var(--tap-min);
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-xs);
  cursor: pointer;
  color: var(--olive);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.sort-btn:hover {
  border-color: var(--ink);
  color: var(--ink);
}

.sort-btn.on {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ARTICLE CARDS - STACKS ON MOBILE, GRID ON TABLET+
   ═══════════════════════════════════════════════════════════════════════════ */

.article {
  background: var(--article-bg);
  border: 1px solid var(--line);
  margin: var(--space-4) 0;
  box-shadow: 2px 2px 0 var(--line);
  cursor: pointer;
  transition: box-shadow 0.2s;
}

.article:hover {
  box-shadow: 3px 3px 0 var(--stamp);
}

/* Mobile: Stack vertically */
.article-inner {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* Tablet+: Side-by-side grid */
@media (min-width: 640px) {
  .article-inner {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: var(--space-4);
  }
}

/* Stamp column */
.article-stamp-col {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--space-3);
}

@media (min-width: 640px) {
  .article-stamp-col {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* Red filing stamp - readable sizes */
.article-stamp {
  background: var(--stamp);
  color: #fff;
  padding: var(--space-2) var(--space-3);
  text-align: center;
  font-family: 'Oswald', sans-serif;
  transform: rotate(-3deg);
  line-height: 1.2;
  flex-shrink: 0;
}

@media (min-width: 640px) {
  .article-stamp {
    transform: rotate(-5deg);
  }
}

.article-stamp .label {
  font-size: var(--text-xs);  /* 12px minimum */
  letter-spacing: 0.15em;
  opacity: 0.9;
}

.article-stamp .date {
  font-size: var(--text-base);  /* 16px */
  font-weight: 700;
  margin-top: var(--space-1);
}

.article-stamp .src {
  font-size: var(--text-xs);  /* 12px */
  margin-top: var(--space-1);
  opacity: 0.85;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Thumbnail */
.article-thumb {
  width: 80px;
  height: 50px;
  overflow: hidden;
  border: 1px solid var(--line);
  flex-shrink: 0;
}

@media (min-width: 640px) {
  .article-thumb {
    width: 100%;
    height: 60px;
    margin-top: var(--space-2);
  }
}

.article-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Article content */
.article-content h3 {
  font-size: var(--text-lg);  /* 18px */
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: var(--space-2);
}

.article-content p {
  font-size: var(--text-sm);  /* 14px */
  line-height: 1.6;
  color: var(--olive);
  margin-bottom: var(--space-3);
}

.article-content .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: var(--text-xs);  /* 12px */
  color: var(--olive);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

/* Action buttons - 44px minimum, wrap on mobile */
.article-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.act-btn {
  background: none;
  border: 2px solid var(--line);
  color: var(--olive);
  padding: var(--space-2) var(--space-3);
  min-height: var(--tap-min);
  display: flex;
  align-items: center;
  gap: var(--space-1);
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: var(--text-sm);  /* 14px */
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.act-btn:hover {
  border-color: var(--ink);
  color: var(--ink);
}

.act-btn.good {
  border-color: var(--good);
  color: var(--good);
}

.act-btn.good:hover,
.act-btn.good.on {
  background: var(--good);
  color: #fff;
}

.act-btn.evil {
  border-color: var(--evil);
  color: var(--evil);
}

.act-btn.evil:hover,
.act-btn.evil.on {
  background: var(--evil);
  color: #fff;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MODALS & PANELS - FULL-WIDTH ON MOBILE
   ═══════════════════════════════════════════════════════════════════════════ */

#panelOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 999;
  display: none;
}

#panelOverlay.open {
  display: block;
}

/* My Cases panel - full-width on mobile, centered on desktop */
#myCasesPanel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--card);
  z-index: 1000;
  overflow-y: auto;
  padding: var(--space-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  -webkit-overflow-scrolling: touch;
}

@media (min-width: 640px) {
  #myCasesPanel {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    max-width: 85vw;
    height: auto;
    max-height: 85vh;
    border: 3px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
  }
}

#myCasesPanel.open {
  opacity: 1;
  pointer-events: auto;
}

#myCasesPanel h2 {
  font-family: 'Oswald', sans-serif;
  font-size: var(--text-xl);
  margin-bottom: var(--space-4);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Close button - 44px tap target */
.close-btn {
  background: none;
  border: none;
  width: var(--tap-min);
  height: var(--tap-min);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-2xl);
  cursor: pointer;
  color: var(--ink);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.close-btn:hover {
  color: var(--stamp);
}

/* ═══════════════════════════════════════════════════════════════════════════
   UTILITY CLASSES
   ═══════════════════════════════════════════════════════════════════════════ */

.hidden {
  display: none !important;
}

/* Skip to main content (accessibility) */
.skip-link {
  position: absolute;
  top: -40px;
  left: 0;
  background: var(--stamp);
  color: #fff;
  padding: var(--space-2) var(--space-4);
  text-decoration: none;
  z-index: 9999;
}

.skip-link:focus {
  top: 0;
}

/* Loading state */
.loading {
  opacity: 0.6;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════════════════
   ACCESSIBILITY & PRINT
   ═══════════════════════════════════════════════════════════════════════════ */

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media print {
  header, #controls, #filterSection, .article-actions {
    display: none;
  }

  .article {
    page-break-inside: avoid;
  }
}
</style>
</head>

<!-- Skip to main content for screen readers -->
<a href="#main" class="skip-link">Skip to main content</a>

<header role="banner">
  <div class="brand">
    <h1>USE CASE <span>ARMS RACE</span></h1>
    <div class="tag mono">
      Build the case for AI ·
      <span class="line2">Report AI before it reports you</span>
    </div>
  </div>

  <div class="hdr-btns">
    <button class="hdr-btn tab on" id="tabArticles">Articles</button>
    <button class="hdr-btn tab" id="tabCases">Cases</button>
    <button class="hdr-btn" id="btnMyCases">My Cases</button>
    <button class="hdr-btn" id="btnAbout">About</button>
    <button class="hdr-btn" id="btnTheme">🌙 Dark</button>
    <button class="hdr-btn admin hidden" id="btnAdmin">Admin</button>
  </div>
</header>

<main id="main" role="main">
  <!-- Search -->
  <div id="controls">
    <input type="text" id="q" placeholder="Search cases..." aria-label="Search">
    <button class="hdr-btn" id="btnSearch">Search</button>
  </div>

  <!-- Filters -->
  <section id="filterSection" aria-label="Filters">
    <button class="filter-popup-btn" id="btnWhoFilter">
      WHO <span class="badge hidden" id="badgeWho">0</span>
    </button>
    <button class="filter-popup-btn" id="btnWhomFilter">
      TO WHOM <span class="badge hidden" id="badgeWhom">0</span>
    </button>
    <button class="time-filter" id="btnToday">
      <span class="num">0</span> Today
    </button>
    <button class="time-filter" id="btnWeek">
      <span class="num">0</span> This Week
    </button>

    <div id="sortBar">
      <span class="sort-label mono">Sort:</span>
      <button class="sort-btn on" id="sortNewest">Newest</button>
      <button class="sort-btn" id="sortVotes">Most Votes</button>
      <button class="sort-btn" id="sortActivity">Activity</button>
    </div>
  </section>

  <!-- Feed -->
  <div id="feed" role="feed" aria-live="polite">
    <p class="mono" style="color: var(--olive); text-align: center; padding: var(--space-8);">
      Loading cases...
    </p>
  </div>
</main>

<!-- My Cases Panel -->
<div id="panelOverlay" aria-hidden="true"></div>
<aside id="myCasesPanel" role="dialog" aria-labelledby="myCasesTitle" aria-hidden="true">
  <h2 id="myCasesTitle">
    My Cases
    <button class="close-btn" id="closeMyCases" aria-label="Close">×</button>
  </h2>
  <div id="myCasesContent">
    <p class="mono" style="color: var(--olive);">No saved cases yet.</p>
  </div>
</aside>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// UCAR 5.0 CLIENT - MOBILE-FIRST JAVASCRIPT
// ═══════════════════════════════════════════════════════════════════════════

const CONFIG = {
  SUPABASE_URL: 'https://aslcrwmbdtvimjrexxzw.supabase.co',

  API_BASE: 'https://aslcrwmbdtvimjrexxzw.supabase.co'
};

// Theme toggle
const btnTheme = document.getElementById('btnTheme');
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  btnTheme.textContent = '☀️ Light';
}

btnTheme.addEventListener('click', () => {
  const theme = document.documentElement.getAttribute('data-theme');
  const newTheme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  btnTheme.textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
});

// My Cases panel
const btnMyCases = document.getElementById('btnMyCases');
const closeMyCases = document.getElementById('closeMyCases');
const myCasesPanel = document.getElementById('myCasesPanel');
const panelOverlay = document.getElementById('panelOverlay');

function openPanel() {
  myCasesPanel.classList.add('open');
  panelOverlay.classList.add('open');
  myCasesPanel.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  myCasesPanel.classList.remove('open');
  panelOverlay.classList.remove('open');
  myCasesPanel.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

btnMyCases.addEventListener('click', openPanel);
closeMyCases.addEventListener('click', closePanel);
panelOverlay.addEventListener('click', closePanel);

// Close panel on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && myCasesPanel.classList.contains('open')) {
    closePanel();
  }
});
