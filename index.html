<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>USE CASE ARMS RACE</title>
<meta name="description" content="Report AI before it reports you. The public docket of AI deployments.">
<style>
:root{
  --bg:#F5F0E6;--fg:#1A1817;--muted:#6B645A;--line:#1A1817;
  --card:#FDFBF5;--accent:#C1121F;--halo:#B8860B;--horn:#C1121F;
  --chip:#E9E2D2;--good:#2E7D32;
}
[data-theme="evil"]{
  --bg:#1A0A12;--fg:#E8E0E4;--muted:#9A8F96;--line:#E8E0E4;
  --card:#241019;--accent:#D4A84C;--halo:#D4A84C;--horn:#FF4757;
  --chip:#331A26;--good:#66BB6A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);
  font-family:'Courier New',Courier,monospace;
  transition:background .3s,color .3s;padding-bottom:80px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;
  padding:16px 0 6px;border-bottom:3px solid var(--line)}
.brand{cursor:pointer}
.brand h1{font-size:clamp(17px,4.6vw,26px);letter-spacing:2px;font-weight:900}
.brand .tag{font-size:10.5px;letter-spacing:1.6px;color:var(--accent);
  font-weight:800;text-transform:uppercase}
.hbtns{display:flex;gap:8px;align-items:center}
#themeToggle{background:none;border:2px solid var(--fg);border-radius:20px;
  padding:8px 12px;font-size:11px;letter-spacing:1px;cursor:pointer;
  font-weight:800;color:var(--fg);font-family:inherit}
.screen{display:none}.screen.active{display:block}
.metrics{font-size:11px;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;padding:10px 2px;display:flex;gap:14px;flex-wrap:wrap}
.metrics b{color:var(--fg)}
/* episode */
.episode{border:3px solid var(--line);background:var(--card);margin:14px 0;
  padding:14px}
.episode .elabel{font-size:10px;letter-spacing:2px;color:var(--accent);
  font-weight:800;margin-bottom:6px}
.episode h3{font-size:16px;margin-bottom:6px}
.episode p{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.episode iframe,.episode video{width:100%;aspect-ratio:16/9;border:2px solid var(--line);
  background:#000}
.episode a.caselink{color:var(--accent);font-weight:800;font-size:12px}
/* casebook strip */
.cbstrip{border:3px solid var(--line);background:var(--card);margin:12px 0}
.cbbar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;cursor:pointer;font-weight:800;letter-spacing:1.5px;
  font-size:12px;text-transform:uppercase}
.cbbar .dot{display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;
  background:var(--accent);color:var(--bg);font-size:10.5px;text-align:center;
  margin-left:6px}
.cbbody{display:none;border-top:2px solid var(--line);padding:10px 12px}
.cbstrip.open .cbbody{display:block}
.cbsec{font-size:10px;letter-spacing:2px;color:var(--muted);margin:8px 0 4px;
  font-weight:800}
.cbrow{display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:7px 4px;border-bottom:1px dashed var(--muted);cursor:pointer;
  font-size:12.5px}
.cbrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:9px;letter-spacing:1px;padding:2px 6px;border:1.5px solid var(--accent);
  color:var(--accent);font-weight:800;border-radius:3px;white-space:nowrap}
.badge.solid{background:var(--accent);color:var(--bg)}
.cbdetail{border-top:2px solid var(--line);margin-top:8px;padding-top:8px}
.cbtools{display:flex;gap:8px;margin-top:8px}
.mini{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:1px;
  padding:6px 10px;cursor:pointer;text-transform:uppercase}
/* search */
.searchbox{margin:12px 0 6px;position:relative}
.searchbox input{width:100%;padding:14px 12px;font-size:16px;
  font-family:inherit;background:var(--card);color:var(--fg);
  border:3px solid var(--line);outline:none}
.latency{font-size:10.5px;color:var(--muted);letter-spacing:1px;margin:5px 2px}
.parserow,.exprow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ptag{font-size:10px;letter-spacing:1px;border:1.5px solid var(--muted);
  color:var(--muted);padding:2px 7px;border-radius:3px;font-weight:800}
.ptag.hit{border-color:var(--accent);color:var(--accent)}
.extag{font-size:10px;letter-spacing:1px;background:var(--chip);color:var(--fg);
  padding:3px 8px;border-radius:3px;font-weight:700;cursor:pointer}
.extag i{font-style:normal;opacity:.6;margin-left:4px}
.filebar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
/* topics + sort */
.toprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tchip{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1px;
  padding:6px 11px;cursor:pointer;border-radius:16px}
.tchip.on{background:var(--fg);color:var(--bg)}
.sortseg{display:flex;border:2px solid var(--fg);margin-left:auto}
.sortseg button{background:none;border:none;color:var(--fg);font-family:inherit;
  font-size:10.5px;font-weight:800;letter-spacing:1px;padding:7px 10px;
  cursor:pointer;text-transform:uppercase}
.sortseg button.on{background:var(--fg);color:var(--bg)}
/* case rows */
.divider{font-size:10px;letter-spacing:2.5px;color:var(--muted);
  border-bottom:2px solid var(--line);padding:12px 2px 4px;margin-bottom:8px;
  font-weight:800;display:flex;justify-content:space-between}
.hit{border:3px solid var(--line);background:var(--card);margin:10px 0;
  padding:12px;cursor:pointer}
.hit .toprule{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hit .cnum{font-size:11px;letter-spacing:1.5px;color:var(--accent);font-weight:900}
.hit .stars{font-size:11px;letter-spacing:2px;color:var(--halo)}
.hit h3{font-size:15.5px;letter-spacing:.6px;margin:4px 0 2px}
.hit .subj{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:800}
.hit p{font-size:12.5px;color:var(--muted);margin:6px 0;line-height:1.45}
.hit .quote{font-size:12px;border-left:3px solid var(--accent);padding-left:8px;
  font-style:italic;margin:6px 0;color:var(--fg)}
.hit .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.fcount{font-size:10.5px;letter-spacing:1px;color:var(--muted);font-weight:800}
.votes{display:flex;gap:8px;margin-left:auto}
.vbtn{display:flex;align-items:center;gap:4px;background:none;
  border:2px solid var(--fg);color:var(--fg);font-family:inherit;
  font-size:12px;font-weight:800;padding:5px 9px;cursor:pointer;border-radius:4px}
.vbtn.halo.on{border-color:var(--halo);color:var(--halo)}
.vbtn.horn.on{border-color:var(--horn);color:var(--horn)}
.vbtn svg{width:15px;height:15px}
/* case page */
.casehead{border-bottom:3px solid var(--line);padding:14px 0 10px;margin-bottom:10px}
.casehead .cnum{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:900}
.casehead h2{font-size:clamp(18px,5vw,26px);letter-spacing:1px;margin:4px 0}
.idrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.idtag{font-size:10.5px;letter-spacing:1px;border:2px solid var(--fg);
  padding:3px 8px;font-weight:800}
.article{border:3px solid var(--line);background:var(--card);padding:14px;margin:12px 0}
.article .alabel{font-size:10px;letter-spacing:2px;color:var(--accent);
  font-weight:800;margin-bottom:6px}
.article h3{font-size:16.5px;margin-bottom:6px;line-height:1.35}
.article p{font-size:13px;line-height:1.5;color:var(--fg)}
.article .quote{border-left:3px solid var(--accent);padding-left:10px;
  font-style:italic;margin:10px 0;font-size:13px}
.srcbtn{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;
  letter-spacing:1px;color:var(--accent);text-decoration:none;
  border:2px solid var(--accent);padding:6px 10px}
.frow{border:2px solid var(--line);background:var(--card);padding:10px;margin:8px 0}
.frow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.frow .subj{font-weight:900;font-size:13px;letter-spacing:.5px}
.frow .date{font-size:10.5px;color:var(--muted)}
.frow p{font-size:12px;color:var(--muted);margin:5px 0;line-height:1.4}
.frow .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.dchip{font-size:10px;background:var(--chip);padding:2px 7px;border-radius:3px;
  font-weight:700}
.frow.q{opacity:.45}
.fakebtn{background:none;border:1.5px solid var(--muted);color:var(--muted);
  font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:1px;
  padding:3px 7px;cursor:pointer;border-radius:3px}
.fakebtn.on{border-color:var(--horn);color:var(--horn)}
.bigvotes{display:flex;gap:12px;justify-content:center;margin:16px 0}
.bigvotes .vbtn{font-size:14px;padding:10px 18px}
.mods{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.mod{background:var(--chip);border:none;color:var(--fg);font-family:inherit;
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:3px;cursor:pointer}
.mod.add{border:2px dashed var(--muted);background:none;color:var(--muted)}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.abtn{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1px;
  padding:9px 13px;cursor:pointer;text-transform:uppercase}
.abtn.accent{border-color:var(--accent);color:var(--accent)}
.proplist{margin:8px 0}
.prop{border:2px dashed var(--muted);padding:8px 10px;margin:6px 0;font-size:12px;
  display:flex;justify-content:space-between;gap:8px;align-items:center}
.linkrow{font-size:11.5px;margin:4px 0;color:var(--muted)}
.linkrow a{color:var(--accent);font-weight:800;cursor:pointer}
/* web results */
.webhit{border:2px dashed var(--muted);background:transparent;margin:8px 0;
  padding:10px 12px}
.webhit h4{font-size:13px;margin-bottom:3px}
.webhit .dom{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}
.webhit p{font-size:11.5px;color:var(--muted);margin:4px 0}
/* sheet + toast + admin */
.sheetback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheetback.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:3px solid var(--line);padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  z-index:41;transform:translateY(105%);transition:transform .22s;max-width:860px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet h4{font-size:13px;letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase}
.sheet label{font-size:10.5px;letter-spacing:1px;color:var(--muted);display:block;
  margin:8px 0 3px;font-weight:800;text-transform:uppercase}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;font-size:15px;
  font-family:inherit;background:var(--bg);color:var(--fg);
  border:2px solid var(--line);outline:none}
.sheet textarea{min-height:110px;resize:vertical}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1;padding:12px;font-family:inherit;font-weight:800;
  letter-spacing:1px;font-size:12px;cursor:pointer}
.sheet .go{background:var(--accent);color:var(--bg);border:none}
.sheet .no{background:none;border:2px solid var(--fg);color:var(--fg)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);
  padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.5px;
  border-radius:4px;transition:transform .25s;z-index:60;max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.aform{border:3px solid var(--line);background:var(--card);padding:12px;margin:12px 0}
.aform h4{font-size:12px;letter-spacing:1.5px;margin-bottom:8px}
.aform input,.aform textarea{width:100%;padding:9px;margin:4px 0;font-family:inherit;
  font-size:13px;background:var(--bg);color:var(--fg);border:2px solid var(--line)}
.aform .mini{margin-top:6px}
.backbtn{background:none;border:none;color:var(--accent);font-family:inherit;
  font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;padding:10px 0}
.empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
footer{margin-top:34px;border-top:3px solid var(--line);padding:14px 2px;
  font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body data-theme="good">
<div class="wrap">
<header>
  <div class="brand" onclick="location.hash='';window.scrollTo(0,0)">
    <h1>USE CASE ARMS RACE</h1>
    <div class="tag">Report AI before it reports you</div>
  </div>
  <div class="hbtns"><button id="themeToggle"></button></div>
</header>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div id="episodeHost"></div>

  <div class="cbstrip" id="cbstrip">
    <div class="cbbar" onclick="toggleBook()">
      <span>CASEBOOK <span class="dot" id="cbCount">0</span></span>
      <span id="cbNewDot"></span>
    </div>
    <div class="cbbody">
      <div id="cbList"></div>
      <div class="cbtools">
        <button class="mini" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="cbdetail" id="cbDetail" style="display:none"></div>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="searchbox">
    <input id="q" type="search" placeholder="Search the docket, or paste a URL to file..."
      autocomplete="off" autocapitalize="none">
  </div>
  <div class="latency" id="latency"></div>
  <div class="parserow" id="parserow"></div>
  <div class="exprow" id="exprow"></div>
  <div class="filebar">
    <button class="mini" id="fileBtn" style="display:none" onclick="fileURL()">File this URL as a case</button>
    <button class="mini" onclick="openTestimony()">File testimony (no link)</button>
  </div>

  <div class="toprow" id="toprow"></div>

  <div id="results"></div>
  <div id="webhost"></div>
</section>

<!-- ============ CASE (#case=N) ============ -->
<section id="casepg" class="screen">
  <button class="backbtn" onclick="location.hash=''">&larr; Back to the docket</button>
  <div id="casehost"></div>
</section>

<!-- ============ ADMIN (#admin) ============ -->
<section id="admin" class="screen">
  <button class="backbtn" onclick="location.hash=''">&larr; Exit admin</button>
  <div class="aform">
    <h4>STEWARD KEY</h4>
    <input id="ak" type="password" placeholder="ADMIN_KEY">
  </div>
  <div class="aform">
    <h4>CASE OF THE DAY / EPISODES</h4>
    <input id="ep-title" placeholder="Title">
    <textarea id="ep-desc" placeholder="Description"></textarea>
    <input id="ep-video" placeholder="Video URL (YouTube embed or mp4)">
    <input id="ep-case" placeholder="Case number (optional)">
    <button class="mini" onclick="saveEpisode()">Publish episode</button>
    <div id="ep-list" style="margin-top:10px"></div>
  </div>
  <div class="aform">
    <h4>PROPOSALS QUEUE</h4>
    <button class="mini" onclick="loadProposals()">Load open proposals</button>
    <div id="prop-admin"></div>
  </div>
  <div class="aform">
    <h4>CRAWLER</h4>
    <div id="crawl-status" class="empty">Load status to begin.</div>
    <button class="mini" onclick="crawlerStatus()">Status</button>
    <button class="mini" onclick="crawlerRun()">Run now</button>
    <button class="mini" onclick="crawlerReview()">Review scored</button>
    <div id="crawl-review"></div>
  </div>
  <div class="aform">
    <h4>PURGE / QUARANTINE</h4>
    <input id="purge-id" placeholder="case or filing uuid">
    <button class="mini" onclick="purge('purge_case')">Purge case</button>
    <button class="mini" onclick="purge('purge_filing')">Purge filing</button>
    <button class="mini" onclick="purge('quarantine')">Quarantine filing</button>
  </div>
</section>

<footer>USE CASE ARMS RACE &middot; THE PUBLIC DOCKET OF AI DEPLOYMENTS &middot; REPORT AI BEFORE IT REPORTS YOU</footer>
</div>

<div class="sheetback" id="sheetback" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<script>
/* UCAR 5.0 frontend: the case docket. */
const CONFIG = {
  SUPABASE_URL: "https://aslcrwmbdtvimjrexxzw.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzbGNyd21iZHR2aW1qcmV4eHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDA0NjgsImV4cCI6MjA5NjcxNjQ2OH0.371d4kCpZ9rKJwBYJGmbFB2OPRq45C3KiXXeyy-q7jI",
  API_BASE: "",                // own-domain front once live
  SHARE_BASE: "https://usecasearmsrace.com/c/",
  FN: n => (CONFIG.API_BASE || CONFIG.SUPABASE_URL) + "/functions/v1/" + n,
};
const DEMO = !CONFIG.SUPABASE_URL;

/* ---------------- identity + storage ---------------- */
function anonId(){
  let id = localStorage.getItem('ucar_anon');
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() :
      'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
      }));
    localStorage.setItem('ucar_anon', id);
  }
  return id;
}
let MY_VOTES = {}, MY_FILED = [], MY_FAKES = {}, SAVES = {};
try{ MY_VOTES = JSON.parse(localStorage.getItem('ucar_votes')||'{}'); }catch(e){}
try{ MY_FILED = JSON.parse(localStorage.getItem('ucar_filed')||'[]'); }catch(e){}
try{ MY_FAKES = JSON.parse(localStorage.getItem('ucar_fakes')||'{}'); }catch(e){}
try{ SAVES = JSON.parse(localStorage.getItem('ucar_saves')||'{}'); }catch(e){}
const persist = () => {
  try{
    localStorage.setItem('ucar_votes', JSON.stringify(MY_VOTES));
    localStorage.setItem('ucar_filed', JSON.stringify(MY_FILED.slice(0,100)));
    localStorage.setItem('ucar_fakes', JSON.stringify(MY_FAKES));
    localStorage.setItem('ucar_saves', JSON.stringify(SAVES));
  }catch(e){}
};

/* ---------------- api ---------------- */
async function api(fn, body){
  const r = await fetch(CONFIG.FN(fn), {
    method:'POST',
    headers:{'Content-Type':'application/json',
      'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY,
      'x-anon-id':anonId()},
    body: JSON.stringify(body||{})
  });
  return r.json();
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------------- theme: GOOD / EVIL ---------------- */
function setTheme(t){
  document.body.dataset.theme=t;
  document.getElementById('themeToggle').textContent =
    t==='good' ? 'GOOD \u2600' : 'EVIL \uD83E\uDDE0';
  try{localStorage.setItem('ucar_theme',t);}catch(e){}
}
document.getElementById('themeToggle').onclick = () =>
  setTheme(document.body.dataset.theme==='good'?'evil':'good');
setTheme(localStorage.getItem('ucar_theme')||'good');

/* ---------------- icons ---------------- */
const ICON_HALO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="12" cy="5" rx="7" ry="2.6"/><path d="M5 13a7 7 0 0 0 14 0"/></svg>';
const ICON_HORN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 3c0 4-2 6-2 9a7 7 0 0 0 14 0c0-3-2-5-2-9"/><path d="M9 21h6"/></svg>';

/* ---------------- demo dataset ---------------- */
const DEMO_CASES = [
 {id:'d1', case_number:101, title_render:'SURVEIL STUDENTS \u00b7 WITH CAMERAS',
  impact:4, heaven_votes:12, hell_votes:87, live_filings:3,
  modifier_terms:['always-on','k-12','no opt out'], status:'live',
  last_filing_at:new Date(Date.now()-4*36e5).toISOString(),
  identity:{verb:'surveil',instrument:'cameras',object_class:'students'},
  filing:{id:'f1',kind:'article',headline:'District expands camera analytics to every hallway',
   summary:'Dee Elementary activated 214 AI cameras that track students between classes. Parents learned of the system from a vendor press release.',
   article_quote:'The system flags loitering, running, and unusual movement patterns for review.',
   subject_name:'Dee Elementary', domain:'example-tribune.com', source_url:'#',
   fake_flags:0, quarantined:false, status:'live',
   object_details:{ages:'5-11'}, instrument_details:{count:'214 cameras'},
   published_at:new Date(Date.now()-4*36e5).toISOString()},
  filings:[

function demoSort(){
  const arr=[...DEMO_CASES];
  const share=c=>(c.heaven_votes+c.hell_votes)?c.hell_votes/(c.heaven_votes+c.hell_votes):.5;
  if(SORT==='worst')arr.sort((a,b)=>share(b)-share(a));
  else if(SORT==='best')arr.sort((a,b)=>share(a)-share(b));
  renderList(arr,'THE DOCKET \u00b7 '+SORT.toUpperCase());

function demoTopic(){
  if(!ACTIVE_TOPIC){demoSort();return;}
  const t=TOPICS.find(x=>x.id===ACTIVE_TOPIC);

function stars(n){return '\u2605'.repeat(n)+'\u2606'.repeat(5-n);}
function isNew(c){return c.last_filing_at&&(Date.now()-new Date(c.last_filing_at))<48*36e5;}
function caseRow(c){
  const el=document.createElement('div');el.className='hit';
  const f=c.filing||{};
  el.innerHTML=
    '<div class="toprule"><span class="cnum">CASE #'+esc(c.case_number)+'</span>'

    +(f.subject_name?'<div class="subj">'+esc(f.subject_name)
      +(f.kind==='testimony'?' \u00b7 TESTIMONY':'')+'</div>':'')
    +(f.summary?'<p>'+esc(f.summary)+'</p>':'')
    +(f.article_quote?'<div class="quote">\u201C'+esc(f.article_quote)+'\u201D</div>':'')
    +'<div class="meta">'
      +'<span class="fcount">'+esc(c.live_filings||0)+' FILING'+((c.live_filings||0)===1?'':'S')+'</span>'
      +(isNew(c)?'<span class="badge solid">NEW</span>':'')
      +'<span class="votes"></span>'
    +'</div>';
  el.querySelector('.votes').appendChild(votePair(c,false));
  el.onclick=()=>{location.hash='#case='+c.case_number;};
  return el;
}
function votePair(c,big){
  const wrap=document.createElement('span');wrap.style.display='flex';wrap.style.gap='8px';
  const mk=(cls,icon,count,val)=>{
    const b=document.createElement('button');
    b.className='vbtn '+cls+(MY_VOTES[c.id]===val?' on':'');
    b.innerHTML=icon+'<span>'+count+'</span>';
    b.onclick=e=>{e.stopPropagation();castVote(c,val,wrap,big);};
    return b;
  };
  wrap.appendChild(mk('halo',ICON_HALO,c.heaven_votes||0,1));
  wrap.appendChild(mk('horn',ICON_HORN,c.hell_votes||0,-1));
  return wrap;
}
async function castVote(c,val,wrap,big){
  const next=(MY_VOTES[c.id]===val)?0:val;
  const prev=MY_VOTES[c.id]||0;
  if(prev===1)c.heaven_votes--; if(prev===-1)c.hell_votes--;
  if(next===1)c.heaven_votes++; if(next===-1)c.hell_votes++;
  MY_VOTES[c.id]=next;persist();
  const fresh=votePair(c,big);wrap.replaceWith(fresh);
  if(DEMO)return;
  try{
    const d=await api('vote',{case_id:c.id,vote:next});
    if(d&&d.heaven!=null){c.heaven_votes=d.heaven;c.hell_votes=d.hell;}
    api('search-cases',{signal:{case_id:c.id,event:'vote',
      terms:currentTerms()}}).catch(()=>{});
  }catch(e){}
}
function currentTerms(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  return q?q.split(/\s+/).slice(0,6):[];
}
function renderList(cases,label){
  const host=document.getElementById('results');host.innerHTML='';
  const div=document.createElement('div');div.className='divider';
  div.innerHTML='<span>'+esc(label)+'</span>';host.appendChild(div);
  if(!cases.length){host.insertAdjacentHTML('beforeend',
    '<div class="empty">Nothing on the docket for that. File the first case.</div>');return;}
  for(const c of cases)host.appendChild(caseRow(c));
}

/* ---------------- search ---------------- */
let searchTimer=null,searchSeq=0;
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim();
  const isUrl=/^https?:\/\/\S+$/i.test(q);
  document.getElementById('fileBtn').style.display=isUrl?'':'none';
  clearTimeout(searchTimer);
  if(!q||isUrl){
    document.getElementById('parserow').innerHTML='';
    document.getElementById('exprow').innerHTML='';
    document.getElementById('webhost').innerHTML='';
    if(!q){DEMO?demoSort():browse();}
    return;
  }
  localRank(q);
  searchTimer=setTimeout(()=>serverSearch(q),200);
});
function localRank(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored=[...CACHE.values()].map(c=>{
    const hay=(c.title_render+' '+((c.filing||{}).summary||'')+' '
      +((c.filing||{}).subject_name||'')+' '+(c.modifier_terms||[]).join(' ')).toLowerCase();
    let s=0;for(const t of terms)if(hay.includes(t))s+=10;
    return {c,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,20).map(x=>x.c);
  renderList(scored,'INSTANT \u00b7 LOCAL');
  document.getElementById('latency').textContent='local index';
}
const EXCLUDED=new Set();
async function serverSearch(q){
  const seq=++searchSeq;
  if(DEMO){localRank(q);return;}
  try{
    const d=await api('search-cases',{q,web:true,exclude:[...EXCLUDED]});
    if(seq!==searchSeq)return;
    (d.results||[]).forEach(c=>CACHE.set(c.id,c));
    lastParsed=d.parsed||null;
    renderList(d.results||[],'THE DOCKET \u00b7 MATCHES');
    document.getElementById('latency').textContent=
      (d.ms!=null?d.ms+'ms \u00b7 ':'')+(d.results||[]).length+' graph hits';
    renderParse(d.parsed);renderExpansion(d.parsed);
    console.log('web_results:', d.web_results);
    renderWeb(d.web_results||[]);
  }catch(e){console.error('search error:',e);}
}
function renderParse(p){
  const host=document.getElementById('parserow');host.innerHTML='';
  if(!p)return;
  const tag=(label,val)=>{const s=document.createElement('span');
    s.className='ptag'+(val?' hit':'');s.textContent=label+': '+(val||'\u2014');
    host.appendChild(s);};
  if(p.action)tag('ACTION',p.action);
  for(const e of (p.entities||[]))tag('NOUN',e);
  for(const m of (p.modifiers||[]))tag('#',m);
  if((p.free||[]).length)tag('FREE',(p.free||[]).join(' '));
}
function renderExpansion(p){
  const host=document.getElementById('exprow');host.innerHTML='';
  if(!p||!p.expanded)return;
  const seen=new Set();
  for(const [term,alts] of Object.entries(p.expanded)){
    for(const a of alts){
      if(seen.has(a.alt)||EXCLUDED.has(a.alt))continue;seen.add(a.alt);
      const b=document.createElement('button');b.className='extag';
      b.innerHTML='SEARCHED AS: '+esc(a.alt)+'<i>\u00d7</i>';
      b.title='via '+esc(term)+' \u00b7 tap to exclude';
      b.onclick=()=>{EXCLUDED.add(a.alt);b.remove();
        serverSearch(document.getElementById('q').value.trim());};
      host.appendChild(b);
    }
  }
}
function renderWeb(list){
  lastWeb=list;
  const host=document.getElementById('webhost');host.innerHTML='';
  if(!list.length)return;
  const div=document.createElement('div');div.className='divider';
  div.innerHTML='<span>FROM THE WEB \u00b7 UNFILED</span>';host.appendChild(div);
  for(const w of list){
    const el=document.createElement('div');el.className='webhit';
    el.innerHTML='<div class="dom">'+esc(w.domain||'')+'</div>'
      +'<h4>'+esc(w.title||w.url)+'</h4><p>'+esc(w.snippet||'')+'</p>'
      +'<button class="mini">File this as a case</button>';
    el.querySelector('button').onclick=()=>fileURL(w.url);
    host.appendChild(el);
  }
}

/* ---------------- filing ---------------- */
async function fileURL(explicit){
  const url=explicit||document.getElementById('q').value.trim();
  if(!/^https?:\/\//i.test(url)){toast('That is not a URL.');return;}
  if(DEMO){toast('Demo mode: fill CONFIG to file real cases.');return;}
  try{
    const d=await api('file-case',{url});
    if(d.ok&&d.filing_id&&!MY_FILED.includes(d.filing_id)){
      MY_FILED.unshift(d.filing_id);persist();renderBook();refreshBookData();
    }
    if(d.dedupe&&d.case_number){
      toast('Already on the docket: Case #'+d.case_number);
      location.hash='#case='+d.case_number;
    }else{
      toast(d.ok?'Filed to your casebook. The steward is reading it.':(d.error||'Could not file.'));
    }
  }catch(e){toast('Could not reach the registry.');}
}
function openTestimony(){
  openSheet('<h4>FILE TESTIMONY</h4>'
   +'<div class="empty">No link? Tell the docket what you saw. Testimony is marked UNSOURCED until corroborated by filings.</div>'
   +'<label>What happened</label><textarea id="tst-body" placeholder="Who deployed what, on whom, where..."></textarea>'
   +'<div class="row"><button class="no" onclick="closeSheet()">Cancel</button>'
   +'<button class="go" onclick="submitTestimony()">File it</button></div>');
}
async function submitTestimony(){
  const text=(document.getElementById('tst-body').value||'').trim();
  if(text.length<60){toast('Give the docket at least 60 characters.');return;}
  if(DEMO){toast('Demo mode: fill CONFIG to file.');closeSheet();return;}
  try{
    const d=await api('file-case',{text});
    if(d.ok&&d.filing_id){MY_FILED.unshift(d.filing_id);persist();renderBook();refreshBookData();}
    toast(d.ok?'Testimony filed. Marked UNSOURCED until corroborated.':(d.error||'Could not file.'));
    closeSheet();
  }catch(e){toast('Could not reach the registry.');}
}

function detailChips(f){
  const chips=[];
  for(const src of [f.object_details,f.instrument_details]){
    if(src&&typeof src==='object'){
      for(const [k,v] of Object.entries(src).slice(0,4)){
        chips.push('<span class="dchip">'+esc(k)+': '+esc(v)+'</span>');
      }
    }
  }
  return chips.join('');
}
function filingRow(f,c){

async function flagFake(f,el,c){
  if(MY_FAKES[f.id]){toast('You already flagged this filing.');return;}
  MY_FAKES[f.id]=1;persist();
  f.fake_flags=(f.fake_flags||0)+1;
  if(DEMO){el.replaceWith(filingRow(f,c));toast('Flag recorded (demo).');return;}
  try{
    const d=await api('flag',{action:'fake',filing_id:f.id});
    if(d.fake_flags!=null)f.fake_flags=d.fake_flags;
    if(d.quarantined){f.quarantined=true;
      toast('Filing quarantined pending steward review. The case survives.');}
    else toast('Fake flag filed on this source.');
    el.replaceWith(filingRow(f,c));
  }catch(e){toast('Could not reach the registry.');}
}

  acts.innerHTML='<button class="abtn" id="saveBtn">'+(saved?'\u2713 In casebook':'+ Save to casebook')+'</button>'
    +'<button class="abtn" id="shareBtn">Share Case #'+esc(c.case_number)+'</button>'
    +'<button class="abtn accent" id="ntsBtn">Not the same</button>';
  host.appendChild(acts);
  acts.querySelector('#saveBtn').onclick=()=>toggleSave(c,acts.querySelector('#saveBtn'));
  acts.querySelector('#shareBtn').onclick=()=>shareCase(c);
  acts.querySelector('#ntsBtn').onclick=()=>openNotTheSame(c);
  const bd=document.createElement('div');bd.className='divider';
  bd.innerHTML='<span>ALL FILINGS \u00b7 '+esc((c.filings||[]).length||c.live_filings||0)+'</span>';
  host.appendChild(bd);
  for(const f of (c.filings&&c.filings.length?c.filings:(c.filing?[c.filing]:[]))){
    host.appendChild(filingRow(f,c));
  }
  const bv=document.createElement('div');bv.className='bigvotes';
  bv.appendChild(votePair(c,true));host.appendChild(bv);
  const md=document.createElement('div');md.className='divider';
  md.innerHTML='<span>COMMUNITY VOCABULARY</span>';host.appendChild(md);
  const mods=document.createElement('div');mods.className='mods';
  for(const t of (c.modifier_terms||[])){
    const b=document.createElement('button');b.className='mod';b.textContent='#'+t;
    b.onclick=()=>{location.hash='';setTimeout(()=>{const q=document.getElementById('q');
      q.value=t;q.dispatchEvent(new Event('input'));},50);};
    mods.appendChild(b);
  }
  const add=document.createElement('button');add.className='mod add';add.textContent='+ add term';
  add.onclick=()=>openModifier(c);mods.appendChild(add);
  host.appendChild(mods);
  const pd=document.createElement('div');pd.className='divider';
  pd.innerHTML='<span>OPEN PROPOSALS</span>';host.appendChild(pd);
  const pl=document.createElement('div');pl.className='proplist';pl.id='proplist';
  pl.innerHTML='<div class="empty">None yet.</div>';host.appendChild(pl);
}
async function toggleSave(c,btn){
  if(SAVES[c.id]){delete SAVES[c.id];btn.textContent='+ Save to casebook';}
  else{SAVES[c.id]={last_seen:c.live_filings||0};btn.textContent='\u2713 In casebook';}
  persist();renderBook();
  if(DEMO)return;
  try{
    await api('saves',SAVES[c.id]
      ?{action:'save',case_id:c.id,last_seen:c.live_filings||0}
      :{action:'unsave',case_id:c.id});
  }catch(e){}
}
async function shareCase(c){
  const url=CONFIG.SHARE_BASE+c.case_number;
  const text='CASE #'+c.case_number+': '+c.title_render+' \u00b7 Report AI before it reports you.';
  if(navigator.share){
    try{await navigator.share({title:'Case #'+c.case_number,text,url});return;}catch(e){}
  }
  try{await navigator.clipboard.writeText(url);toast('Case link copied: '+url);}
  catch(e){toast(url);}
}
function openNotTheSame(c){
  openSheet('<h4>NOT THE SAME</h4>'
   +'<div class="empty">Propose a split when this docket mixes two different practices. Name the class that makes it different (students vs workers). The steward confirms; a new immortal case number is minted.</div>'
   +'<label>Different object class</label><input id="nts-class" placeholder="e.g. employees">'
   +'<label>Why (optional)</label><input id="nts-note" placeholder="Watching kids is not watching staff">'
   +'<div class="row"><button class="no" onclick="closeSheet()">Cancel</button>'
   +'<button class="go" onclick="submitNTS()">Propose the split</button></div>');
}
async function submitNTS(){
  const cls=(document.getElementById('nts-class').value||'').trim().toLowerCase();
  const note=(document.getElementById('nts-note').value||'').trim();
  if(!cls){toast('Name the class that splits it.');return;}
  if(DEMO){toast('Split proposed (demo).');closeSheet();return;}
  try{
    const d=await api('proposals',{action:'create',kind:'not_the_same',
      case_id:CURRENT_CASE.id,payload:{object_class:cls,note,filing_ids:[]}});
    toast(d.ok?'Split proposed. Others can support it; the steward decides.':(d.error||'Could not propose.'));
    closeSheet();loadCaseProposals(CURRENT_CASE);
  }catch(e){toast('Could not reach the registry.');}
}
async function loadCaseProposals(c){
  if(DEMO)return;
  try{
    const r=await fetch(CONFIG.FN('proposals')+'?case_id='+encodeURIComponent(c.id),
      {headers:{'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY}});
    const d=await r.json();
    const host=document.getElementById('proplist');if(!host)return;
    const list=d.proposals||[];
    if(!list.length){host.innerHTML='<div class="empty">None yet.</div>';return;}
    host.innerHTML='';
    for(const p of list){
      const el=document.createElement('div');el.className='prop';
      el.innerHTML='<span><b>'+esc(p.kind.replace(/_/g,' ').toUpperCase())+'</b> '
        +esc(p.payload&&p.payload.object_class?('\u2192 '+p.payload.object_class):'')
        +' \u00b7 '+esc(p.support)+' support</span>'
        +'<button class="mini">Support</button>';
      el.querySelector('button').onclick=async()=>{
        try{const r2=await api('proposals',{action:'support',id:p.id});
          toast('Supported ('+(r2.support||'?')+').');}catch(e){}
      };
      host.appendChild(el);
    }
  }catch(e){}
}
function openModifier(c){
  openSheet('<h4>ADD TO THE VOCABULARY</h4>'
   +'<label>Term</label><input id="mod-term" placeholder="always-on, opt out, k-12...">'
   +'<div class="row"><button class="no" onclick="closeSheet()">Cancel</button>'
   +'<button class="go" onclick="submitModifier()">File it</button></div>');
}
async function submitModifier(){
  const term=(document.getElementById('mod-term').value||'').trim().toLowerCase();
  if(!term||term.length>40){toast('One short term.');return;}
  const c=CURRENT_CASE;
  if(DEMO){c.modifier_terms.push(term);renderCase(document.getElementById('casehost'),c);
    closeSheet();toast('Filed (demo).');return;}
  try{
    const d=await api('modifiers',{case_id:c.id,slot:'case',kind:'compound',term});
    if(d.ok){c.modifier_terms=c.modifier_terms||[];
      if(!c.modifier_terms.includes(term))c.modifier_terms.push(term);
      renderCase(document.getElementById('casehost'),c);
      toast(d.strengthened?'Term strengthened.':'Filed. It is now search vocabulary.');}
    else toast(d.error||'Could not file.');
    closeSheet();
  }catch(e){toast('Could not reach the registry.');}
}
function openTopicSheet(){
  openSheet('<h4>PROPOSE A TOPIC BUTTON</h4>'
   +'<div class="empty">Topics are semantic: cases match by meaning through the graph, no literal tag needed. Steward approves.</div>'
   +'<label>Name</label><input id="tp-name" placeholder="Housing">'
   +'<label>Terms (comma separated, 2+)</label><input id="tp-terms" placeholder="tenants, eviction, screening">'
   +'<div class="row"><button class="no" onclick="closeSheet()">Cancel</button>'
   +'<button class="go" onclick="submitTopic()">Propose it</button></div>');
}
async function submitTopic(){
  const name=(document.getElementById('tp-name').value||'').trim();
  const terms=(document.getElementById('tp-terms').value||'').split(',')
    .map(t=>t.trim().toLowerCase()).filter(Boolean);
  if(!name||terms.length<2){toast('Name plus at least two terms.');return;}
  if(DEMO){toast('Topic proposed (demo).');closeSheet();return;}
  try{
    const d=await api('proposals',{action:'create',kind:'topic',
      payload:{name,terms}});
    toast(d.ok?'Topic proposed to the steward.':(d.error||'Could not propose.'));
    closeSheet();
  }catch(e){toast('Could not reach the registry.');}
}

/* ---------------- casebook (3-state accordion) ---------------- */
let FILED_CACHE=[];
function toggleBook(){
  CB_OPEN=!CB_OPEN;
  document.getElementById('cbstrip').classList.toggle('open',CB_OPEN);
  document.getElementById('cbDetail').style.display='none';
  if(CB_OPEN)renderBook();
}
function bookCount(){
  return new Set([...MY_FILED,...Object.keys(SAVES)]).size;
}
async function refreshBookData(){
  if(DEMO)return;
  try{
    if(MY_FILED.length){
      const d=await api('search-cases',{filing_ids:MY_FILED.slice(0,50)});
      FILED_CACHE=d.filings||[];
    }
    const ids=Object.keys(SAVES);
    if(ids.length){
      const d2=await api('search-cases',{ids:ids.slice(0,50)});
      (d2.results||[]).forEach(c=>CACHE.set(c.id,c));
    }
    renderBook();
  }catch(e){}
}
function renderBook(){
  document.getElementById('cbCount').textContent=bookCount();
  let hasNew=false;
  for(const [id,s] of Object.entries(SAVES)){
    const c=CACHE.get(id);
    if(c&&(c.live_filings||0)>(s.last_seen||0)){hasNew=true;break;}
  }
  document.getElementById('cbNewDot').innerHTML=
    hasNew?'<span class="badge solid">NEW FILINGS</span>':'';
  if(!CB_OPEN)return;
  const host=document.getElementById('cbList');host.innerHTML='';
  host.insertAdjacentHTML('beforeend','<div class="cbsec">FILED BY YOU</div>');
  if(DEMO&&!FILED_CACHE.length){
    host.insertAdjacentHTML('beforeend',
      '<div class="cbrow"><span class="nm">My kid says the cameras follow them...</span>'
      +'<span class="badge">AWAITING OWNER</span></div>');
  }else if(!FILED_CACHE.length){
    host.insertAdjacentHTML('beforeend',
      '<div class="empty">Paste any article URL into search, or file testimony. It lands here with its pipeline status.</div>');
  }else{
    for(const f of FILED_CACHE){
      const el=document.createElement('div');el.className='cbrow';
      const chip=f.status==='staged'?'STEWARD READING'
        :f.status==='under_review'?'AWAITING OWNER'
        :f.status==='live'?'LIVE':'';
      el.innerHTML='<span class="nm">'+esc(f.headline||f.source_url||'Testimony')+'</span>'
        +(chip?'<span class="badge'+(f.status==='live'?' solid':'')+'">'+chip+'</span>':'');
      if(f.case&&f.case.case_number){
        el.onclick=()=>bookOpenCase(null,f.case.case_number);
      }
      host.appendChild(el);
    }
  }
  host.insertAdjacentHTML('beforeend','<div class="cbsec">SAVED CASES</div>');
  const savedIds=Object.keys(SAVES);
  if(!savedIds.length){
    host.insertAdjacentHTML('beforeend',
      '<div class="empty">Save any case and it lives here. New filings light it up.</div>');
  }else{
    for(const id of savedIds){
      const c=CACHE.get(id);if(!c)continue;
      const fresh=(c.live_filings||0)>((SAVES[id]||{}).last_seen||0);
      const el=document.createElement('div');el.className='cbrow';
      el.innerHTML='<span class="nm">#'+esc(c.case_number)+' '+esc(c.title_render)+'</span>'
        +(fresh?'<span class="badge solid">NEW</span>':'');
      el.onclick=()=>bookOpenCase(c,c.case_number);
      host.appendChild(el);
    }
  }
}
async function bookOpenCase(c,num){
  const det=document.getElementById('cbDetail');
  det.style.display='block';
  det.innerHTML='<div class="empty">Opening case...</div>';
  let kase=c;
  if(!kase||!kase.filings){
    if(DEMO){kase=DEMO_CASES.find(x=>String(x.case_number)===String(num));}
    else{
      try{const d=await api('search-cases',{case_number:Number(num)});
        kase=(d.results||[])[0];if(kase)CACHE.set(kase.id,kase);}catch(e){}
    }
  }
  if(!kase){det.innerHTML='<div class="empty">Could not open it.</div>';return;}
  CURRENT_CASE=kase;
  renderCase(det,kase);
  det.insertAdjacentHTML('beforeend',
    '<button class="mini" style="margin-top:8px" onclick="document.getElementById(\'cbDetail\').style.display=\'none\'">Close</button>');
  if(SAVES[kase.id]){
    SAVES[kase.id].last_seen=kase.live_filings||0;persist();renderBook();
    det.style.display='block';
    if(!DEMO)api('saves',{action:'seen',case_id:kase.id,
      last_seen:kase.live_filings||0}).catch(()=>{});
  }
}
function exportCSV(){
  const rows=[['case_number','title','my_vote','heaven','hell','filings','newest_source','saved']];
  const ids=new Set([...Object.keys(SAVES)]);
  for(const f of FILED_CACHE){if(f.case_id)ids.add(f.case_id);}
  for(const id of ids){
    const c=CACHE.get(id);if(!c)continue;
    rows.push([c.case_number,c.title_render,
      MY_VOTES[c.id]===1?'good':MY_VOTES[c.id]===-1?'evil':'',
      c.heaven_votes||0,c.hell_votes||0,c.live_filings||0,
      (c.filing&&c.filing.source_url)||'',
      SAVES[id]?new Date(SAVES[id].saved_at||Date.now()).toISOString().slice(0,10):'']);
  }
  const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='casebook.csv';a.click();
  toast('Casebook exported.');
}

/* ---------------- sheet plumbing ---------------- */
function openSheet(html){
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetback').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetback').classList.remove('open');
}

/* ---------------- admin ---------------- */
const adminKey=()=>document.getElementById('ak').value.trim();
async function adminApi(fn,params,body){
  const r=await fetch(CONFIG.FN(fn)+(params||''),{method:'POST',
    headers:{'Content-Type':'application/json',
      'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY,
      'x-admin-key':adminKey()},
    body:JSON.stringify(body||{})});
  return r.json();
}
async function saveEpisode(){
  const body={title:val('ep-title'),description:val('ep-desc'),
    video_url:val('ep-video'),case_number:val('ep-case'),featured:true};
  if(!body.title){toast('Title required.');return;}
  try{
    const d=await adminApi('episodes','',{action:'upsert',episode:body});
    toast(d.ok?'Episode published.':(d.error||'Failed.'));
    loadEpisode();
  }catch(e){toast('Failed.');}
}
function val(id){return (document.getElementById(id).value||'').trim();}
async function loadProposals(){
  try{
    const r=await fetch(CONFIG.FN('proposals'),{headers:{
      'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY}});
    const d=await r.json();
    const host=document.getElementById('prop-admin');host.innerHTML='';
    for(const p of (d.proposals||[])){
      const el=document.createElement('div');el.className='prop';
      el.innerHTML='<span><b>'+esc(p.kind)+'</b> '+esc(JSON.stringify(p.payload).slice(0,80))
        +' \u00b7 '+esc(p.support)+' support</span><span></span>';
      const ok=document.createElement('button');ok.className='mini';ok.textContent='Approve';
      ok.onclick=async()=>{const r2=await adminApi('proposals','',{action:'decide',
        id:p.id,decision:'approve'});
        toast(r2.ok?('Approved.'+(r2.new_case_number?' Minted Case #'+r2.new_case_number:'')):(r2.error||'Failed.'));
        loadProposals();};
      const no=document.createElement('button');no.className='mini';no.textContent='Reject';
      no.onclick=async()=>{await adminApi('proposals','',{action:'decide',
        id:p.id,decision:'reject'});loadProposals();};
      el.lastElementChild.append(ok,no);
      host.appendChild(el);
    }
    if(!(d.proposals||[]).length)host.innerHTML='<div class="empty">Queue is clear.</div>';
  }catch(e){toast('Failed.');}
}
async function crawlerStatus(){
  try{const d=await adminApi('crawler','?action=status');
    document.getElementById('crawl-status').textContent=JSON.stringify(d.counts||d);}
  catch(e){toast('Failed.');}
}
async function crawlerRun(){
  toast('Crawler running...');
  try{const d=await adminApi('crawler','?action=run');
    document.getElementById('crawl-status').textContent=JSON.stringify(d.stats||d);}
  catch(e){toast('Failed.');}
}
async function crawlerReview(){
  try{
    const d=await adminApi('crawler','?action=review');
    const host=document.getElementById('crawl-review');host.innerHTML='';
    for(const p of (d.prospects||[])){
      const el=document.createElement('div');el.className='prop';
      el.innerHTML='<span>['+esc(Math.round(p.score||0))+'] '+esc(p.title||p.url)+'</span><span></span>';
      const ok=document.createElement('button');ok.className='mini';ok.textContent='Promote';
      ok.onclick=async()=>{await adminApi('crawler','?action=promote_one',{id:p.id});
        toast('Promoted to a filing.');crawlerReview();};
      const no=document.createElement('button');no.className='mini';no.textContent='Reject';
      no.onclick=async()=>{await adminApi('crawler','?action=reject_one',{id:p.id});crawlerReview();};
      el.lastElementChild.append(ok,no);host.appendChild(el);
    }
    if(!(d.prospects||[]).length)host.innerHTML='<div class="empty">Nothing scored yet.</div>';
  }catch(e){toast('Failed.');}
}
async function purge(action){
  const id=val('purge-id');if(!id){toast('Paste a uuid.');return;}
  try{const d=await adminApi('crawler','?action='+action,{id,on:true});
    toast(JSON.stringify(d.stats||d));}
  catch(e){toast('Failed.');}
}

/* ---------------- routing ---------------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash;
  const m=h.match(/^#case=(\d+)/);
  if(m){openCase(m[1]);return;}
  if(h==='#admin'){show('admin');return;}
  show('home');
}
window.addEventListener('hashchange',route);
boot();route();
