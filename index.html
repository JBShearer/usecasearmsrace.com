<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>USE CASE ARMS RACE</title>
<meta name="description" content="Report AI before it reports you. The public docket of AI deployments.">
<style>
:root{
  --bg:#F5F0E6;--fg:#1A1817;--muted:#4A4540;--line:#1A1817;
  --card:#FDFBF5;--accent:#C1121F;--halo:#B8860B;--horn:#C1121F;
  --chip:#E9E2D2;--good:#2E7D32;
}
[data-theme="evil"]{
  --bg:#1A0A12;--fg:#E8E0E4;--muted:#C8C0C4;--line:#E8E0E4;
  --card:#241019;--accent:#D4A84C;--halo:#D4A84C;--horn:#FF4757;
  --chip:#331A26;--good:#66BB6A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);
  font-family:'Courier New',Courier,monospace;
  transition:background .3s,color .3s;padding-bottom:80px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;
  padding:16px 0 6px;border-bottom:3px solid var(--line)}
.brand{cursor:pointer}
.brand h1{font-size:clamp(17px,4.6vw,26px);letter-spacing:2px;font-weight:900}
.brand .tag{font-size:10.5px;letter-spacing:1.6px;color:var(--accent);
  font-weight:800;text-transform:uppercase}
.hbtns{display:flex;gap:8px;align-items:center}
#themeToggle{background:none;border:2px solid var(--fg);border-radius:20px;
  padding:8px 12px;font-size:11px;letter-spacing:1px;cursor:pointer;
  font-weight:800;color:var(--fg);font-family:inherit}
.screen{display:none}.screen.active{display:block}
.metrics{font-size:11px;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;padding:10px 2px;display:flex;gap:14px;flex-wrap:wrap}
.metrics b{color:var(--fg)}
/* episode */
.episode{border:3px solid var(--line);background:var(--card);margin:14px 0;padding:14px}
.episode .elabel{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:800;margin-bottom:6px}
.episode h3{font-size:16px;margin-bottom:6px}
.episode p{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.episode iframe,.episode video{width:100%;aspect-ratio:16/9;border:2px solid var(--line);background:#000}
.episode a.caselink{color:var(--accent);font-weight:800;font-size:12px}
/* casebook strip */
.cbstrip{border:3px solid var(--line);background:var(--card);margin:12px 0}
.cbbar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;cursor:pointer;font-weight:800;letter-spacing:1.5px;font-size:12px;text-transform:uppercase}
.cbbar .dot{display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;
  background:var(--accent);color:var(--bg);font-size:10.5px;text-align:center;margin-left:6px}
.cbbody{display:none;border-top:2px solid var(--line);padding:10px 12px}
.cbstrip.open .cbbody{display:block}
.cbsec{font-size:10px;letter-spacing:2px;color:var(--muted);margin:8px 0 4px;font-weight:800}
.cbrow{display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:7px 4px;border-bottom:1px dashed var(--muted);cursor:pointer;font-size:12.5px}
.cbrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:9px;letter-spacing:1px;padding:2px 6px;border:1.5px solid var(--accent);
  color:var(--accent);font-weight:800;border-radius:3px;white-space:nowrap}
.badge.solid{background:var(--accent);color:var(--bg)}
.cbdetail{border-top:2px solid var(--line);margin-top:8px;padding-top:8px}
.cbtools{display:flex;gap:8px;margin-top:8px}
.mini{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:1px;
  padding:6px 10px;cursor:pointer;text-transform:uppercase}
/* search */
.searchbox{margin:12px 0 6px;position:relative}
.searchbox input{width:100%;padding:14px 12px;font-size:16px;
  font-family:inherit;background:var(--card);color:var(--fg);border:3px solid var(--line);outline:none}
.latency{font-size:10.5px;color:var(--muted);letter-spacing:1px;margin:5px 2px}
.filebar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
/* topics + sort */
.toprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tchip{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1px;
  padding:6px 11px;cursor:pointer;border-radius:16px}
.tchip.on{background:var(--fg);color:var(--bg)}
.modeseg{display:flex;border:2px solid var(--accent);margin-right:12px}
.modeseg button{background:none;border:none;color:var(--accent);font-family:inherit;
  font-size:10.5px;font-weight:800;letter-spacing:1px;padding:7px 10px;cursor:pointer;text-transform:uppercase}
.modeseg button.on{background:var(--accent);color:var(--bg)}
.sortseg{display:flex;border:2px solid var(--fg);margin-left:auto}
.sortseg button{background:none;border:none;color:var(--fg);font-family:inherit;
  font-size:10.5px;font-weight:800;letter-spacing:1px;padding:7px 10px;cursor:pointer;text-transform:uppercase}
.sortseg button.on{background:var(--fg);color:var(--bg)}
/* case rows */
.divider{font-size:11px;letter-spacing:2px;color:var(--muted);
  border-bottom:2px solid var(--line);padding:12px 2px 4px;margin-bottom:8px;font-weight:800;display:flex;justify-content:space-between}
.hit{border:3px solid var(--line);background:var(--card);margin:10px 0;padding:12px;cursor:pointer}
.hit .toprule{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hit .cnum{font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:900}
.hit .stars{font-size:12px;letter-spacing:2px;color:var(--halo)}
.hit h3{font-size:16px;letter-spacing:.5px;margin:4px 0 2px;line-height:1.3}
.hit .subj{font-size:12px;color:var(--muted);letter-spacing:1px;font-weight:800}
.hit p{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.5}
.hit .quote{font-size:13px;border-left:3px solid var(--accent);padding-left:8px;font-style:italic;margin:6px 0;color:var(--fg)}
.hit .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hit.filing .domain{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:800;text-transform:uppercase}
.hit.filing .timeago{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:800}
.hit.filing .filing-headline{cursor:pointer}
.hit.filing .filing-headline:hover{color:var(--accent)}
.hit.filing .caselink{font-size:11px;letter-spacing:1px;color:var(--accent);font-weight:800;cursor:pointer}
.hit.filing .caselink:hover{text-decoration:underline}
.fcount{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:800}
.votes{display:flex;gap:8px;margin-left:auto}
.vbtn{display:flex;align-items:center;gap:4px;background:none;
  border:2px solid var(--fg);color:var(--fg);font-family:inherit;
  font-size:12px;font-weight:800;padding:5px 9px;cursor:pointer;border-radius:4px}
.vbtn.halo.on{border-color:var(--halo);color:var(--halo)}
.vbtn.horn.on{border-color:var(--horn);color:var(--horn)}
.vbtn svg{width:15px;height:15px}
/* case page */
.casehead{border-bottom:3px solid var(--line);padding:14px 0 10px;margin-bottom:10px}
.casehead .cnum{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:900}
.casehead h2{font-size:clamp(18px,5vw,26px);letter-spacing:1px;margin:4px 0}
.casehead .casedesc{font-size:14px;color:var(--muted);margin:8px 0;line-height:1.5}
.frow{border:2px solid var(--line);background:var(--card);padding:10px;margin:8px 0}
.frow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.frow .subj{font-weight:900;font-size:13px;letter-spacing:.5px}
.frow .date{font-size:11px;color:var(--muted)}
.frow p{font-size:13px;color:var(--muted);margin:5px 0;line-height:1.45}
.frow .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.dchip{font-size:11px;background:var(--chip);padding:2px 7px;border-radius:3px;font-weight:700}
.srcbtn{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;
  letter-spacing:1px;color:var(--accent);text-decoration:none;border:2px solid var(--accent);padding:6px 10px}
.bigvotes{display:flex;gap:12px;justify-content:center;margin:16px 0}
.bigvotes .vbtn{font-size:14px;padding:10px 18px}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.abtn{background:none;border:2px solid var(--fg);color:var(--fg);
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:1px;
  padding:9px 13px;cursor:pointer;text-transform:uppercase}
.abtn.accent{border-color:var(--accent);color:var(--accent)}
/* sheet + toast + admin */
.sheetback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheetback.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:3px solid var(--line);padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  z-index:41;transform:translateY(105%);transition:transform .22s;max-width:860px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet h4{font-size:13px;letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase}
.sheet label{font-size:10.5px;letter-spacing:1px;color:var(--muted);display:block;margin:8px 0 3px;font-weight:800;text-transform:uppercase}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;font-size:15px;
  font-family:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--line);outline:none}
.sheet textarea{min-height:110px;resize:vertical}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1;padding:12px;font-family:inherit;font-weight:800;letter-spacing:1px;font-size:12px;cursor:pointer}
.sheet .go{background:var(--accent);color:var(--bg);border:none}
.sheet .no{background:none;border:2px solid var(--fg);color:var(--fg)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);
  padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.5px;
  border-radius:4px;transition:transform .25s;z-index:60;max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.aform{border:3px solid var(--line);background:var(--card);padding:12px;margin:12px 0}
.aform h4{font-size:12px;letter-spacing:1.5px;margin-bottom:8px}
.aform input,.aform textarea{width:100%;padding:9px;margin:4px 0;font-family:inherit;
  font-size:13px;background:var(--bg);color:var(--fg);border:2px solid var(--line)}
.aform .mini{margin-top:6px}
.backbtn{background:none;border:none;color:var(--accent);font-family:inherit;
  font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;padding:10px 0}
.empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
footer{margin-top:34px;border-top:3px solid var(--line);padding:14px 2px;
  font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body data-theme="good">
<div class="wrap">
<header>
  <div class="brand" onclick="location.hash='';window.scrollTo(0,0)">
    <h1>USE CASE ARMS RACE</h1>
    <div class="tag">Report AI before it reports you</div>
  </div>
  <div class="hbtns"><button id="themeToggle"></button></div>
</header>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div id="episodeHost"></div>

  <div class="cbstrip" id="cbstrip">
    <div class="cbbar" onclick="toggleBook()">
      <span>CASEBOOK <span class="dot" id="cbCount">0</span></span>
      <span id="cbNewDot"></span>
    </div>
    <div class="cbbody">
      <div id="cbList"></div>
      <div class="cbtools">
        <button class="mini" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="cbdetail" id="cbDetail" style="display:none"></div>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="searchbox">
    <input id="q" type="search" placeholder="Search the docket, or paste a URL to file..." autocomplete="off" autocapitalize="none">
  </div>
  <div class="latency" id="latency"></div>
  <div class="filebar">
    <button class="mini" id="fileBtn" style="display:none" onclick="fileURL()">File this URL as a case</button>
    <button class="mini" onclick="openTestimony()">File testimony (no link)</button>
  </div>

  <div class="toprow" id="toprow"></div>
  <div id="results"></div>
</section>

<!-- ============ CASE (#case=N) ============ -->
<section id="casepg" class="screen">
  <button class="backbtn" onclick="location.hash=''">&larr; Back to the docket</button>
  <div id="casehost"></div>
</section>

<!-- ============ ADMIN (#admin) ============ -->
<section id="admin" class="screen">
  <button class="backbtn" onclick="location.hash=''">&larr; Exit admin</button>
  <div class="aform">
    <h4>ADMIN KEY</h4>
    <input id="ak" type="password" placeholder="ADMIN_KEY">
  </div>
  <div class="aform">
    <h4>DAILY SHOW / EPISODE</h4>
    <input id="ep-title" placeholder="Title">
    <textarea id="ep-desc" placeholder="Description"></textarea>
    <input id="ep-video" placeholder="Video URL (YouTube embed or mp4)">
    <button class="mini" onclick="saveEpisode()">Publish episode</button>
  </div>
  <div class="aform">
    <h4>VOCABULARY REVIEW</h4>
    <button class="mini" onclick="loadVocabPending()">Load pending terms</button>
    <div id="vocab-pending"></div>
  </div>
  <div class="aform">
    <h4>CRAWLER</h4>
    <div id="crawl-status" class="empty">Load status to begin.</div>
    <button class="mini" onclick="crawlerStatus()">Status</button>
    <button class="mini" onclick="crawlerRun()">Run now</button>
    <button class="mini" onclick="extractRun()">Extract now</button>
  </div>
</section>

<footer>USE CASE ARMS RACE &middot; THE PUBLIC DOCKET OF AI DEPLOYMENTS &middot; REPORT AI BEFORE IT REPORTS YOU</footer>
</div>

<div class="sheetback" id="sheetback" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── CONFIG: filled by deploy.sh ────────────────────────────────────────────
const SUPABASE_URL = 'https://znhsnishdqrmumxbgobq.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuaHNuaXNoZHFybXVteGJnb2JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNzEwNjMsImV4cCI6MjA5OTY0NzA2M30.k22R9kcbLCp9OyTVBb7DaUbk_Gdghnu-YGKUYc834Rs';
const SHARE_BASE = location.origin + location.pathname;
// ───────────────────────────────────────────────────────────────────────────

const sb = createClient(SUPABASE_URL, ANON_KEY);
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ─────────────────── Identity & Storage ─────────────────── */
let USER = null;
let MY_VOTES = {}, SAVES = {};
try { MY_VOTES = JSON.parse(localStorage.getItem('ucar_votes') || '{}'); } catch {}
try { SAVES = JSON.parse(localStorage.getItem('ucar_saves') || '{}'); } catch {}
const persist = () => {
  try {
    localStorage.setItem('ucar_votes', JSON.stringify(MY_VOTES));
    localStorage.setItem('ucar_saves', JSON.stringify(SAVES));
  } catch {}
};

/* ─────────────────── Utilities ─────────────────── */
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); };
const relTime = iso => {
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 0) return '';
  const mins = Math.floor(ms / 60000);
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd';
  return Math.floor(days / 7) + 'w';
};
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const isNew = c => c.last_filed_at && (Date.now() - new Date(c.last_filed_at)) < 48 * 3600000;

/* ─────────────────── Theme ─────────────────── */
function setTheme(t) {
  document.body.dataset.theme = t;
  $('#themeToggle').textContent = t === 'good' ? 'GOOD ☀' : 'EVIL 🧠';
  try { localStorage.setItem('ucar_theme', t); } catch {}
}
$('#themeToggle').onclick = () => setTheme(document.body.dataset.theme === 'good' ? 'evil' : 'good');
setTheme(localStorage.getItem('ucar_theme') || 'good');

/* ─────────────────── Icons ─────────────────── */
const ICON_HALO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="12" cy="5" rx="7" ry="2.6"/><path d="M5 13a7 7 0 0 0 14 0"/></svg>';
const ICON_HORN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 3c0 4-2 6-2 9a7 7 0 0 0 14 0c0-3-2-5-2-9"/><path d="M9 21h6"/></svg>';

/* ─────────────────── State ─────────────────── */
const CACHE = new Map();
let SORT = 'newest', VIEW_MODE = 'feed', CB_OPEN = false, CURRENT_CASE = null;

/* ─────────────────── Boot ─────────────────── */
async function boot() {
  // Anonymous auth
  let { data: { session } } = await sb.auth.getSession();
  if (!session) { ({ data: { session } } = await sb.auth.signInAnonymously()); }
  USER = session?.user ?? null;

  // Load user's votes and tracks from DB
  if (USER) {
    const { data: votes } = await sb.from('votes').select('case_id, kind');
    (votes || []).forEach(v => MY_VOTES[v.case_id] = v.kind === 'good' ? 1 : v.kind === 'evil' ? -1 : 0);
    const { data: tracks } = await sb.from('tracks').select('case_id');
    (tracks || []).forEach(t => { if (!SAVES[t.case_id]) SAVES[t.case_id] = { last_seen: 0 }; });
    persist();
  }

  renderTopics();
  renderBook();
  loadMetrics();
  loadEpisode();
  loadView();
  route();
}

/* ─────────────────── Data Loading ─────────────────── */
async function loadMetrics() {
  const { count: cases } = await sb.from('cases').select('*', { count: 'exact', head: true }).eq('status', 'live');
  const yesterday = new Date(Date.now() - 86400000).toISOString();
  const { count: newToday } = await sb.from('filings').select('*', { count: 'exact', head: true }).gt('created_at', yesterday);
  $('#metrics').innerHTML = `<span><b>${cases || 0}</b> cases</span><span><b>${newToday || 0}</b> new 24h</span>`;
}

async function loadEpisode() {
  const { data } = await sb.from('daily_show').select('*').order('show_date', { ascending: false }).limit(1);
  const ep = data?.[0];
  if (ep) renderEpisode(ep);
}

function renderEpisode(ep) {
  const host = $('#episodeHost');
  let media = '';
  if (ep.video_url) {
    const yt = ep.video_url.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
    media = yt
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}" allowfullscreen frameborder="0"></iframe>`
      : `<video src="${esc(ep.video_url)}" controls playsinline></video>`;
  }
  host.innerHTML = `<div class="episode"><div class="elabel">CASE OF THE DAY</div>
    <h3>${esc(ep.title)}</h3><p>${esc(ep.blurb || '')}</p>${media}</div>`;
}

/* ─────────────────── Topics & Sort ─────────────────── */
function renderTopics() {
  const host = $('#toprow');
  host.innerHTML = '';

  // Mode toggle: FEED vs CASES
  const modeDiv = document.createElement('div');
  modeDiv.className = 'modeseg';
  for (const m of ['feed', 'cases']) {
    const b = document.createElement('button');
    b.textContent = m.toUpperCase();
    if (VIEW_MODE === m) b.className = 'on';
    b.onclick = () => { VIEW_MODE = m; renderTopics(); loadView(); };
    modeDiv.appendChild(b);
  }
  host.appendChild(modeDiv);

  // Sort buttons
  const seg = document.createElement('div');
  seg.className = 'sortseg';
  for (const s of ['newest', 'evil', 'good']) {
    const b = document.createElement('button');
    b.textContent = s;
    if (SORT === s) b.className = 'on';
    b.onclick = () => { SORT = s; renderTopics(); loadView(); };
    seg.appendChild(b);
  }
  host.appendChild(seg);
}

function loadView() {
  if (VIEW_MODE === 'feed') loadFeed();
  else loadCases();
}

async function loadFeed() {
  const q = $('#q').value.trim();
  let filings;

  if (q) {
    // Search via API
    const res = await fetch(`${SUPABASE_URL}/functions/v1/api?action=search`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${ANON_KEY}`, apikey: ANON_KEY },
      body: JSON.stringify({ q, limit: 40 })
    }).then(r => r.json()).catch(() => ({ results: [] }));
    filings = res.results || [];
  } else {
    // Browse filings
    let query = sb.from('filings')
      .select('*, cases(id, case_number, title_render, good_votes, evil_votes, fake_votes, filing_count)')
      .eq('status', 'live')
      .limit(40);

    if (SORT === 'newest') query = query.order('created_at', { ascending: false });
    else if (SORT === 'evil') query = query.order('impact', { ascending: false });

    const { data } = await query;
    filings = (data || []).map(f => ({ ...f, cases: f.cases }));
  }

  renderFilingList(filings, q ? `SEARCH · ${esc(q)}` : `THE FEED · ${SORT.toUpperCase()}`);
  $('#latency').textContent = `${filings.length} filings`;
}

async function loadCases() {
  let query = sb.from('cases')
    .select('*')
    .eq('status', 'live')
    .limit(60);

  if (SORT === 'newest') query = query.order('last_filed_at', { ascending: false, nullsFirst: false });
  else if (SORT === 'evil') query = query.order('evil_votes', { ascending: false });
  else if (SORT === 'good') query = query.order('good_votes', { ascending: false });

  const { data: cases } = await query;
  (cases || []).forEach(c => CACHE.set(c.id, c));
  renderCaseList(cases || [], `THE DOCKET · ${SORT.toUpperCase()}`);
  $('#latency').textContent = `${(cases || []).length} cases`;
}

/* ─────────────────── Rendering Lists ─────────────────── */
function renderCaseList(cases, label) {
  const host = $('#results');
  host.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'divider';
  div.innerHTML = `<span>${esc(label)}</span>`;
  host.appendChild(div);

  if (!cases.length) {
    host.insertAdjacentHTML('beforeend', '<div class="empty">Nothing on the docket yet.</div>');
    return;
  }
  for (const c of cases) host.appendChild(caseRow(c));
}

function caseRow(c) {
  const el = document.createElement('div');
  el.className = 'hit';
  el.innerHTML = `
    <div class="toprule">
      <span class="cnum">CASE #${esc(c.case_number)}</span>
      <span class="stars">${stars(c.impact || 3)}</span>
    </div>
    <h3>${esc(c.title_render)}</h3>
    <div class="meta">
      <span class="fcount">${c.filing_count || 0} FILING${(c.filing_count || 0) === 1 ? '' : 'S'}</span>
      ${isNew(c) ? '<span class="badge solid">NEW</span>' : ''}
      <span class="votes"></span>
    </div>`;
  el.querySelector('.votes').appendChild(votePair(c, false));
  el.onclick = () => { location.hash = '#case=' + c.case_number; };
  return el;
}

function renderFilingList(filings, label) {
  const host = $('#results');
  host.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'divider';
  div.innerHTML = `<span>${esc(label)}</span>`;
  host.appendChild(div);

  if (!filings.length) {
    host.insertAdjacentHTML('beforeend', '<div class="empty">No filings yet. File the first case.</div>');
    return;
  }
  for (const f of filings) host.appendChild(feedFilingRow(f));
}

function feedFilingRow(f) {
  const el = document.createElement('div');
  el.className = 'hit filing';
  const c = f.cases || {};
  const timeAgo = f.created_at ? relTime(f.created_at) : '';
  el.innerHTML = `
    <div class="toprule">
      <span class="domain">${esc(f.source_domain || '')}</span>
      ${timeAgo ? `<span class="timeago">${timeAgo}</span>` : ''}
    </div>
    <h3 class="filing-headline">${esc(f.headline || f.summary || '')}</h3>
    ${f.summary && f.headline ? `<p>${esc(f.summary)}</p>` : ''}
    ${f.article_quote ? `<div class="quote">"${esc(f.article_quote)}"</div>` : ''}
    <div class="meta">
      ${c.case_number ? `<span class="caselink">CASE #${esc(c.case_number)} · ${esc(c.title_render || '')}</span>` : ''}
    </div>`;

  const headline = el.querySelector('.filing-headline');
  if (headline && f.source_url) {
    headline.style.cursor = 'pointer';
    headline.onclick = e => { e.stopPropagation(); window.open(f.source_url, '_blank'); };
  }
  const clink = el.querySelector('.caselink');
  if (clink && c.case_number) {
    clink.onclick = e => { e.stopPropagation(); location.hash = '#case=' + c.case_number; };
  }
  return el;
}

/* ─────────────────── Voting ─────────────────── */
function votePair(c, big) {
  const wrap = document.createElement('span');
  wrap.style.display = 'flex';
  wrap.style.gap = '8px';
  const mk = (cls, icon, count, val) => {
    const b = document.createElement('button');
    b.className = 'vbtn ' + cls + (MY_VOTES[c.id] === val ? ' on' : '');
    b.innerHTML = icon + '<span>' + count + '</span>';
    b.onclick = e => { e.stopPropagation(); castVote(c, val, wrap, big); };
    return b;
  };
  wrap.appendChild(mk('halo', ICON_HALO, c.good_votes || 0, 1));
  wrap.appendChild(mk('horn', ICON_HORN, c.evil_votes || 0, -1));
  return wrap;
}

async function castVote(c, val, wrap, big) {
  const next = MY_VOTES[c.id] === val ? 0 : val;
  const prev = MY_VOTES[c.id] || 0;

  // Optimistic update
  if (prev === 1) c.good_votes--;
  if (prev === -1) c.evil_votes--;
  if (next === 1) c.good_votes++;
  if (next === -1) c.evil_votes++;
  MY_VOTES[c.id] = next;
  persist();

  const fresh = votePair(c, big);
  wrap.replaceWith(fresh);

  // Persist to DB
  if (USER) {
    const kind = next === 1 ? 'good' : next === -1 ? 'evil' : null;
    if (kind) {
      await sb.from('votes').upsert({ user_id: USER.id, case_id: c.id, kind });
    } else {
      await sb.from('votes').delete().eq('user_id', USER.id).eq('case_id', c.id);
    }
  }
}

/* ─────────────────── Case Page ─────────────────── */
async function openCase(num) {
  show('casepg');
  const host = $('#casehost');
  host.innerHTML = '<div class="empty">Pulling the docket...</div>';

  const { data } = await sb.from('cases').select('*').eq('case_number', num).single();
  if (!data) { host.innerHTML = '<div class="empty">No such case on the docket.</div>'; return; }

  CACHE.set(data.id, data);
  CURRENT_CASE = data;

  const { data: filings } = await sb.from('filings')
    .select('*')
    .eq('case_id', data.id)
    .eq('status', 'live')
    .order('created_at', { ascending: false })
    .limit(30);

  renderCasePage(host, data, filings || []);
}

function renderCasePage(host, c, filings) {
  host.innerHTML = '';

  // Header
  const head = document.createElement('div');
  head.className = 'casehead';
  head.innerHTML = `
    <div class="cnum">CASE #${esc(c.case_number)} · ${stars(c.impact || 3)}</div>
    <h2>${esc(c.title_render)}</h2>`;
  host.appendChild(head);

  // Big votes
  const bv = document.createElement('div');
  bv.className = 'bigvotes';
  bv.appendChild(votePair(c, true));
  host.appendChild(bv);

  // Action buttons
  const saved = !!SAVES[c.id];
  const acts = document.createElement('div');
  acts.className = 'actionrow';
  acts.innerHTML = `
    <button class="abtn" id="saveBtn">${saved ? '✓ In casebook' : '+ Save to casebook'}</button>
    <button class="abtn" id="shareBtn">Share</button>`;
  host.appendChild(acts);
  acts.querySelector('#saveBtn').onclick = () => toggleSave(c, acts.querySelector('#saveBtn'));
  acts.querySelector('#shareBtn').onclick = () => shareCase(c);

  // Filings
  const bd = document.createElement('div');
  bd.className = 'divider';
  bd.innerHTML = `<span>FILINGS · ${filings.length}</span>`;
  host.appendChild(bd);

  for (const f of filings) {
    host.appendChild(filingRow(f));
  }
}

function filingRow(f) {
  const el = document.createElement('div');
  el.className = 'frow';
  el.innerHTML = `
    <div class="top">
      <span class="subj">${esc(f.subject || f.source_domain || 'Unknown')}</span>
      <span class="date">${f.created_at ? new Date(f.created_at).toLocaleDateString() : ''}</span>
    </div>
    ${f.headline ? `<p style="color:var(--fg);font-weight:700">${esc(f.headline)}</p>` : ''}
    ${f.summary ? `<p>${esc(f.summary)}</p>` : ''}
    ${f.article_quote ? `<div class="quote" style="border-left:3px solid var(--accent);padding-left:10px;font-style:italic;margin:10px 0">"${esc(f.article_quote)}"</div>` : ''}
    ${f.source_url ? `<a class="srcbtn" style="margin:0;font-size:9.5px;padding:4px 8px" href="${esc(f.source_url)}" target="_blank" rel="noopener">Source</a>` : ''}`;
  return el;
}

/* ─────────────────── Save / Share ─────────────────── */
async function toggleSave(c, btn) {
  if (SAVES[c.id]) {
    delete SAVES[c.id];
    btn.textContent = '+ Save to casebook';
    if (USER) await sb.from('tracks').delete().eq('user_id', USER.id).eq('case_id', c.id);
  } else {
    SAVES[c.id] = { last_seen: c.filing_count || 0 };
    btn.textContent = '✓ In casebook';
    if (USER) await sb.from('tracks').upsert({ user_id: USER.id, case_id: c.id });
  }
  persist();
  renderBook();
}

async function shareCase(c) {
  const url = SHARE_BASE + '?c=' + c.case_number;
  const text = 'CASE #' + c.case_number + ': ' + c.title_render + ' · Report AI before it reports you.';
  if (navigator.share) {
    try { await navigator.share({ title: 'Case #' + c.case_number, text, url }); return; } catch {}
  }
  try { await navigator.clipboard.writeText(url); toast('Case link copied: ' + url); }
  catch { toast(url); }
}

/* ─────────────────── Casebook ─────────────────── */
function toggleBook() {
  CB_OPEN = !CB_OPEN;
  $('#cbstrip').classList.toggle('open', CB_OPEN);
  $('#cbDetail').style.display = 'none';
  if (CB_OPEN) renderBook();
}

function bookCount() {
  return Object.keys(SAVES).length;
}

function renderBook() {
  $('#cbCount').textContent = bookCount();

  // Check for new filings
  let hasNew = false;
  for (const [id, s] of Object.entries(SAVES)) {
    const c = CACHE.get(id);
    if (c && (c.filing_count || 0) > (s.last_seen || 0)) { hasNew = true; break; }
  }
  $('#cbNewDot').innerHTML = hasNew ? '<span class="badge solid">NEW FILINGS</span>' : '';

  if (!CB_OPEN) return;

  const host = $('#cbList');
  host.innerHTML = '<div class="cbsec">SAVED CASES</div>';

  const savedIds = Object.keys(SAVES);
  if (!savedIds.length) {
    host.insertAdjacentHTML('beforeend', '<div class="empty">Save any case and it lives here. New filings light it up.</div>');
  } else {
    for (const id of savedIds) {
      const c = CACHE.get(id);
      if (!c) continue;
      const fresh = (c.filing_count || 0) > ((SAVES[id] || {}).last_seen || 0);
      const el = document.createElement('div');
      el.className = 'cbrow';
      el.innerHTML = `<span class="nm">#${esc(c.case_number)} ${esc(c.title_render)}</span>
        ${fresh ? '<span class="badge solid">NEW</span>' : ''}`;
      el.onclick = () => { location.hash = '#case=' + c.case_number; };
      host.appendChild(el);
    }
  }
}

function exportCSV() {
  const rows = [['case_number', 'title', 'my_vote', 'good', 'evil', 'filings', 'saved']];
  for (const id of Object.keys(SAVES)) {
    const c = CACHE.get(id);
    if (!c) continue;
    rows.push([
      c.case_number, c.title_render,
      MY_VOTES[c.id] === 1 ? 'good' : MY_VOTES[c.id] === -1 ? 'evil' : '',
      c.good_votes || 0, c.evil_votes || 0, c.filing_count || 0,
      SAVES[id] ? new Date().toISOString().slice(0, 10) : ''
    ]);
  }
  const csv = rows.map(r => r.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'casebook.csv';
  a.click();
  toast('Casebook exported.');
}

/* ─────────────────── Filing ─────────────────── */
async function fileURL(explicit) {
  const url = explicit || $('#q').value.trim();
  if (!/^https?:\/\//i.test(url)) { toast('That is not a URL.'); return; }

  toast('Filing... this may take a moment.');

  // Add to prospects via crawler
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/crawler?action=seed_urls`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': localStorage.getItem('ucar_admin_key') || '' },
      body: JSON.stringify({ urls: [url] })
    }).then(r => r.json());

    if (res.added) {
      toast('URL queued for extraction. Check back in a few minutes.');
    } else {
      toast('Could not queue URL. May already exist.');
    }
  } catch (e) {
    toast('Could not reach the registry.');
  }
}
window.fileURL = fileURL;

function openTestimony() {
  openSheet(`<h4>FILE TESTIMONY</h4>
    <div class="empty">No link? Tell the docket what you saw. Testimony is marked UNSOURCED until corroborated.</div>
    <label>What happened</label>
    <textarea id="tst-body" placeholder="Who deployed what, on whom, where..."></textarea>
    <div class="row">
      <button class="no" onclick="closeSheet()">Cancel</button>
      <button class="go" onclick="submitTestimony()">File it</button>
    </div>`);
}
window.openTestimony = openTestimony;

async function submitTestimony() {
  const text = ($('#tst-body')?.value || '').trim();
  if (text.length < 60) { toast('Give the docket at least 60 characters.'); return; }
  toast('Testimony feature coming soon. For now, paste a source URL.');
  closeSheet();
}
window.submitTestimony = submitTestimony;

/* ─────────────────── Search ─────────────────── */
let searchTimer = null;
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim();
  const isUrl = /^https?:\/\/\S+$/i.test(q);
  $('#fileBtn').style.display = isUrl ? '' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadView(), 300);
});

/* ─────────────────── Sheet ─────────────────── */
function openSheet(html) {
  $('#sheet').innerHTML = html;
  $('#sheet').classList.add('open');
  $('#sheetback').classList.add('open');
}
window.openSheet = openSheet;

function closeSheet() {
  $('#sheet').classList.remove('open');
  $('#sheetback').classList.remove('open');
}
window.closeSheet = closeSheet;

/* ─────────────────── Admin ─────────────────── */
const adminKey = () => $('#ak')?.value?.trim() || localStorage.getItem('ucar_admin_key') || '';

async function saveEpisode() {
  const title = $('#ep-title')?.value?.trim();
  const blurb = $('#ep-desc')?.value?.trim();
  const video_url = $('#ep-video')?.value?.trim();
  if (!title) { toast('Title required.'); return; }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/api?action=set_show`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': adminKey() },
      body: JSON.stringify({ title, blurb, video_url })
    }).then(r => r.json());
    toast(res.ok ? 'Episode published.' : (res.error || 'Failed.'));
    loadEpisode();
  } catch { toast('Failed.'); }
}
window.saveEpisode = saveEpisode;

async function loadVocabPending() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/api?action=vocab_pending`, {
      method: 'POST',
      headers: { 'x-admin-key': adminKey() }
    }).then(r => r.json());

    const host = $('#vocab-pending');
    host.innerHTML = '';
    for (const t of (res.pending || [])) {
      const el = document.createElement('div');
      el.className = 'frow';
      el.innerHTML = `<span><b>${esc(t.kind)}</b>: ${esc(t.term)}</span>
        <button class="mini" data-id="${t.id}" data-action="approve">Approve</button>`;
      el.querySelector('button').onclick = async () => {
        await fetch(`${SUPABASE_URL}/functions/v1/api?action=vocab_approve`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-admin-key': adminKey() },
          body: JSON.stringify({ term_id: t.id })
        });
        toast('Approved.');
        loadVocabPending();
      };
      host.appendChild(el);
    }
    if (!(res.pending || []).length) host.innerHTML = '<div class="empty">No pending terms.</div>';
  } catch { toast('Failed.'); }
}
window.loadVocabPending = loadVocabPending;

async function crawlerStatus() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/crawler?action=status`, {
      method: 'POST',
      headers: { 'x-admin-key': adminKey() }
    }).then(r => r.json());
    $('#crawl-status').textContent = JSON.stringify(res, null, 2);
  } catch { toast('Failed.'); }
}
window.crawlerStatus = crawlerStatus;

async function crawlerRun() {
  toast('Crawler running...');
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/crawler?action=run`, {
      method: 'POST',
      headers: { 'x-admin-key': adminKey() }
    }).then(r => r.json());
    $('#crawl-status').textContent = JSON.stringify(res, null, 2);
    toast('Crawler complete.');
  } catch { toast('Failed.'); }
}
window.crawlerRun = crawlerRun;

async function extractRun() {
  toast('Extracting...');
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/extract?action=run`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': adminKey() },
      body: JSON.stringify({ max: 5 })
    }).then(r => r.json());
    $('#crawl-status').textContent = JSON.stringify(res, null, 2);
    toast('Extraction complete.');
  } catch { toast('Failed.'); }
}
window.extractRun = extractRun;

/* ─────────────────── Routing ─────────────────── */
function show(id) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  $(`#${id}`).classList.add('active');
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash;
  const m = h.match(/^#case=(\d+)/);
  if (m) { openCase(m[1]); return; }
  if (h === '#admin') { show('admin'); return; }

  // Check for ?c= query param (share links)
  const params = new URLSearchParams(location.search);
  if (params.has('c')) { openCase(params.get('c')); return; }

  show('home');
}

window.addEventListener('hashchange', route);
window.toggleBook = toggleBook;
window.exportCSV = exportCSV;

// Boot
boot();
</script>
