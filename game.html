<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>USE CASE ARMS RACE</title>
<style>
:root {
  --cream:#F5F0E6;--marker:#1A1817;--stamp:#C1121F;--pencil:#6B6560;
  --brain-bg:#0D0A0F;--brain-fg:#E8E0E4;--spotlight:#D4A84C;--shadow:#4A3045;
  --bg:var(--cream);--fg:var(--marker);--accent:var(--stamp);--muted:var(--pencil);
  --good:#2D8B4A;--good-glow:#4ADE80;--evil:#C1121F;--evil-glow:#FF4444;--neutral:#6B6560;
}
[data-theme="dark"]{--bg:var(--brain-bg);--fg:var(--brain-fg);--accent:var(--spotlight);--muted:var(--shadow)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,sans-serif;min-height:100vh}

header{padding:14px 18px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;align-items:center}
h1{font-size:14px;font-weight:800;letter-spacing:4px;text-transform:uppercase;cursor:pointer}
.theme-toggle{background:none;border:1px solid var(--muted);color:var(--fg);padding:6px 10px;font-size:16px;cursor:pointer;border-radius:4px}

main{max-width:520px;margin:0 auto;padding:16px}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Casebook */
.search-box{width:100%;padding:14px;font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--fg);margin-bottom:16px}
.case-list{display:flex;flex-direction:column;gap:12px}
.case-card{border:2px solid var(--fg);padding:16px;cursor:pointer;background:var(--bg);transition:all .15s}
.case-card:hover{box-shadow:4px 4px 0 var(--fg)}
.case-card h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.case-card .quote{font-size:13px;color:var(--muted);font-style:italic;border-left:3px solid var(--accent);padding-left:12px;margin-bottom:8px}
.case-card .meta{font-size:10px;color:var(--muted);letter-spacing:1px}

/* Case Screen */
.back-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-bottom:12px}
.case-title{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.story-box{background:var(--fg);color:var(--bg);padding:16px;margin-bottom:12px;font-size:14px;line-height:1.6}
.story-quote{font-style:italic;border-left:3px solid var(--accent);padding-left:12px;margin-bottom:12px;color:var(--muted);font-size:13px}
.source-link{display:inline-block;font-size:10px;color:var(--accent);text-decoration:none;letter-spacing:1px;margin-bottom:20px}

.triple-section{margin-bottom:16px}
.triple-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.triple-label span{color:var(--accent);font-weight:700}
.triple-choices{display:flex;flex-wrap:wrap;gap:6px}
.triple-btn{padding:8px 12px;font:inherit;font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--fg);cursor:pointer}
.triple-btn:hover{background:var(--fg);color:var(--bg)}
.triple-btn.selected{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.notes-section{margin-top:20px;padding-top:16px;border-top:1px dashed var(--muted)}
.notes-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.notes-label span{color:var(--accent)}
.notes-input{width:100%;padding:10px;font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--muted);min-height:60px;resize:vertical}

.submit-btn{width:100%;padding:16px;margin-top:16px;font:inherit;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;background:var(--fg);color:var(--bg);border:none;cursor:pointer}
.submit-btn:disabled{opacity:0.3;cursor:not-allowed}

/* Doom Clock */
.doom-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(12,5,8,0.97),#000);display:none;align-items:center;justify-content:center;z-index:100}
.doom-overlay.active{display:flex}
.doom-machine{text-align:center;width:90%;max-width:380px}
.doom-warn{font-size:10px;letter-spacing:5px;color:var(--evil);margin-bottom:4px}
.doom-title{font-size:32px;font-weight:800;letter-spacing:4px;color:#EDE6D6;margin-bottom:32px}
.doom-slots{display:flex;gap:10px;justify-content:center;margin-bottom:32px}
.doom-slot{flex:1;height:70px;background:linear-gradient(180deg,#18181c,#0c0c0e);border:3px solid #2a2a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:1px;color:#444;overflow:hidden}
.doom-slot.spinning .slot-text{animation:spin .07s linear infinite}
@keyframes spin{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.doom-slot.landed{border-color:var(--spotlight);box-shadow:0 0 24px rgba(212,168,76,0.3)}
.doom-slot.landed .slot-text{color:var(--spotlight);animation:none;font-size:10px}
.doom-status{font-size:11px;letter-spacing:2px;color:#555;margin-bottom:24px;min-height:20px}
.doom-skip{padding:10px 24px;font:inherit;font-size:10px;letter-spacing:2px;background:none;color:#444;border:1px solid #333;cursor:pointer;border-radius:4px}

/* Card */
.card-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.97);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto}
.card-overlay.active{display:flex}
.card-wrap{text-align:center}
.card{width:280px;background:#08080a;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.card::before{content:'';position:absolute;inset:0;border-radius:14px;padding:3px;background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none}
.card.good{--c:var(--good);--cg:var(--good-glow)}
.card.evil{--c:var(--evil);--cg:var(--evil-glow)}
.card.neutral{--c:var(--neutral);--cg:#888}
.card-art{height:120px;background:#0c0c0e;display:flex;align-items:center;justify-content:center;position:relative}
.card-art-icon{font-size:48px}
.card-rarity{position:absolute;top:8px;right:8px;font-size:7px;font-weight:700;letter-spacing:1px;color:var(--c);background:rgba(0,0,0,0.6);padding:3px 6px;border-radius:3px}
.card-body{padding:14px}
.card-name{font-size:11px;font-weight:800;letter-spacing:1px;color:#EDE6D6;margin-bottom:4px}
.card-triple{font-size:9px;color:var(--c);letter-spacing:1px;margin-bottom:8px;line-height:1.4}
.card-quote{font-size:10px;font-style:italic;color:#555;margin-bottom:10px;line-height:1.4}
.card-ability{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:10px;margin-bottom:10px;text-align:left}
.card-ability-name{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--c);margin-bottom:3px}
.card-ability-text{font-size:9px;color:#777;line-height:1.4}
.card-stats{display:flex;justify-content:center;gap:24px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
.card-stat-label{font-size:7px;color:#444;letter-spacing:1px}
.card-stat-val{font-size:18px;font-weight:800;color:var(--c)}
.card-qr{position:absolute;bottom:12px;right:12px;width:32px;height:32px;background:#fff;border-radius:2px}
.card-close{width:280px;padding:12px;margin-top:14px;font:inherit;font-size:10px;font-weight:700;letter-spacing:2px;background:var(--c,#333);color:#000;border:none;cursor:pointer;border-radius:6px}

.scratcher{position:absolute;top:138px;left:14px;right:14px;height:60px;background:#1a1a1e;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:1px;color:#333;cursor:pointer;border-radius:6px;transition:opacity .3s}
.scratcher.revealed{opacity:0;pointer-events:none}

@keyframes foil{0%{background-position:200% center}100%{background-position:-200% center}}
.card.rare::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.08) 48%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.08) 52%,transparent 70%);background-size:200% 100%;animation:foil 2.5s linear infinite;pointer-events:none;border-radius:14px}

.file-prompt{border:2px dashed var(--muted);padding:20px;text-align:center;margin-top:16px}
.file-prompt p{font-size:12px;color:var(--muted);margin-bottom:10px}
.file-btn{padding:10px 20px;font:inherit;font-size:11px;letter-spacing:2px;background:var(--fg);color:var(--bg);border:none;cursor:pointer}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--fg);color:var(--bg);padding:10px 18px;font-size:12px;z-index:300;border-radius:4px;opacity:0;transition:all .3s}
.toast.active{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <h1 onclick="goHome()">Use Case Arms Race</h1>
  <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
</header>

<main>
  <!-- Casebook -->
  <section id="casebook" class="screen active">
    <input class="search-box" id="search" placeholder="Search or paste URL..." oninput="handleSearch(this.value)">
    <div class="case-list" id="caseList"></div>
    <div id="filePrompt" class="file-prompt" style="display:none">
      <p>📰 News story detected</p>
      <button class="file-btn" onclick="fileCase()">Put it in the mail →</button>
    </div>
  </section>

  <!-- Case -->
  <section id="case" class="screen">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="case-title" id="caseTitle"></div>
    <div class="story-box" id="storyBox"></div>
    <div class="story-quote" id="storyQuote"></div>
    <a href="#" class="source-link" id="sourceLink" target="_blank">↗ Source</a>

    <div class="triple-section">
      <div class="triple-label"><span>1</span> Who</div>
      <div class="triple-choices" id="choices-who"></div>
    </div>
    <div class="triple-section">
      <div class="triple-label"><span>2</span> Does What</div>
      <div class="triple-choices" id="choices-what"></div>
    </div>
    <div class="triple-section">
      <div class="triple-label"><span>3</span> To Whom</div>
      <div class="triple-choices" id="choices-whom"></div>
    </div>

    <div class="notes-section">
      <div class="notes-label">Mad Lib <span>vs</span> Mad Conservative</div>
      <textarea class="notes-input" id="notes" placeholder="Hot take..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="spin()" disabled>Case Closed →</button>
  </section>
</main>

<!-- Doom Clock -->
<div class="doom-overlay" id="doomOverlay">
  <div class="doom-machine">
    <div class="doom-warn">⚠ WARNING</div>
    <div class="doom-title">DOOM CLOCK</div>
    <div class="doom-slots">
      <div class="doom-slot" id="slot-who"><span class="slot-text">WHO</span></div>
      <div class="doom-slot" id="slot-what"><span class="slot-text">WHAT</span></div>
      <div class="doom-slot" id="slot-whom"><span class="slot-text">WHOM</span></div>
    </div>
    <div class="doom-status" id="doomStatus"></div>
    <button class="doom-skip" onclick="skipDoom()">Skip</button>
  </div>
</div>

<!-- Card -->
<div class="card-overlay" id="cardOverlay">
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-art"><span class="card-art-icon" id="cardIcon">👁</span></div>
      <div class="card-rarity" id="cardRarity">COMMON</div>
      <div class="card-body">
        <div class="card-name" id="cardName"></div>
        <div class="card-triple" id="cardTriple"></div>
        <div class="card-quote" id="cardQuote"></div>
        <div class="card-ability">
          <div class="card-ability-name" id="abilityName">⚡ ABILITY</div>
          <div class="card-ability-text" id="abilityText"></div>
        </div>
        <div class="card-stats">
          <div class="card-stat"><div class="card-stat-label">ATK</div><div class="card-stat-val" id="statAtk">0</div></div>
          <div class="card-stat"><div class="card-stat-label">DEF</div><div class="card-stat-val" id="statDef">0</div></div>
          <div class="card-stat"><div class="card-stat-label">EVL</div><div class="card-stat-val" id="statEvl">0</div></div>
        </div>
      </div>
      <div class="card-qr" id="cardQr"></div>
      <div class="scratcher" id="scratcher" onclick="this.classList.add('revealed')">▓▓ SCRATCH ▓▓</div>
    </div>
    <button class="card-close" onclick="closeCard()">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://aslcrwmbdtvimjrexxzw.supabase.co/functions/v1/';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzbGNyd21iZHR2aW1qcmV4eHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDA0NjgsImV4cCI6MjA5NjcxNjQ2OH0.XYG0LrgA_92h7dGjw0aamX53WIrwQaqPHNHQLe8p9ls';

let CASES=[], CURRENT=null, PICKS={who:null,what:null,whom:null};

// Theme
const getTheme=()=>localStorage.getItem('ucar_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const setTheme=t=>{document.documentElement.setAttribute('data-theme',t);localStorage.setItem('ucar_theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'🧠':'☀️'};
const toggleTheme=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
setTheme(getTheme());

// Nav
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)};
const goHome=()=>{CURRENT=null;PICKS={who:null,what:null,whom:null};show('casebook')};

// Casebook
const renderCases=list=>{
  document.getElementById('caseList').innerHTML=list.map(c=>`
    <div class="case-card" onclick="openCase('${c.id}')">
      <h3>${esc(c.title||c.raw_title)}</h3>
      ${c.article_quote?`<div class="quote">"${esc(trunc(c.article_quote,70))}"</div>`:''}
      <div class="meta">IMPACT ${'★'.repeat(c.impact||1)}</div>
    </div>`).join('');
};

const handleSearch=v=>{
  const fp=document.getElementById('filePrompt');
  if(/^https?:\/\/.+\..+/.test(v.trim())){fp.style.display='block';fp.dataset.url=v}
  else{fp.style.display='none';const q=v.toLowerCase();renderCases(CASES.filter(c=>(c.title||'').toLowerCase().includes(q)||(c.article_quote||'').toLowerCase().includes(q)))}
};

const fileCase=()=>{toast('📬 In the mail!');document.getElementById('search').value='';document.getElementById('filePrompt').style.display='none'};

// Case
function openCase(id){
  CURRENT=CASES.find(c=>c.id===id);
  if(!CURRENT||!CURRENT.extraction)return toast('Not ready');
  PICKS={who:null,what:null,whom:null};

  document.getElementById('caseTitle').textContent=CURRENT.title||CURRENT.raw_title;
  document.getElementById('storyBox').textContent=CURRENT.summary||'';
  const q=CURRENT.article_quote||CURRENT.extraction.article_quote;
  document.getElementById('storyQuote').textContent=q?`"${q}"`:'';
  document.getElementById('storyQuote').style.display=q?'block':'none';
  document.getElementById('sourceLink').href=CURRENT.source_url||'#';

  const ex=CURRENT.extraction;
  renderTriple('who',ex.who_choices||[]);
  renderTriple('what',ex.action_choices||[]);
  renderTriple('whom',ex.whom_choices||[]);
  checkReady();
  show('case');
}

function renderTriple(slot,choices){
  document.getElementById(`choices-${slot}`).innerHTML=choices.map((c,i)=>`<button class="triple-btn" onclick="pick('${slot}',${i},this)">${esc(c)}</button>`).join('');
}

function pick(slot,idx,btn){
  const ex=CURRENT.extraction;
  const arr=slot==='who'?ex.who_choices:slot==='what'?ex.action_choices:ex.whom_choices;
  PICKS[slot]=arr[idx];
  btn.parentElement.querySelectorAll('.triple-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  checkReady();
}

function checkReady(){document.getElementById('submitBtn').disabled=!(PICKS.who&&PICKS.what&&PICKS.whom)}

// Doom
const MSGS=['Scanning...','Calculating...','Processing...','Almost...'];
function spin(){
  show('casebook');
  document.getElementById('doomOverlay').classList.add('active');
  ['who','what','whom'].forEach(s=>{const el=document.getElementById(`slot-${s}`);el.classList.remove('landed');el.classList.add('spinning');el.querySelector('.slot-text').textContent='???'});
  let i=0;const iv=setInterval(()=>{document.getElementById('doomStatus').textContent=MSGS[i++%MSGS.length]},300);
  setTimeout(()=>land('who',PICKS.who),800);
  setTimeout(()=>land('what',PICKS.what),1300);
  setTimeout(()=>land('whom',PICKS.whom),1800);
  setTimeout(()=>{clearInterval(iv);document.getElementById('doomStatus').textContent='Done.';setTimeout(showCard,700)},2400);
}

function land(slot,val){const el=document.getElementById(`slot-${slot}`);el.classList.remove('spinning');el.classList.add('landed');el.querySelector('.slot-text').textContent=trunc(val,9)}
function skipDoom(){document.getElementById('doomOverlay').classList.remove('active');showCard()}

// Card
function showCard(){
  document.getElementById('doomOverlay').classList.remove('active');
  const c=CURRENT,ex=c.extraction||{};
  const evl=Math.min(10,Math.abs(ex.valence||0)+(c.impact||1));
  const verdict=evl>=5?'evil':evl<=2?'good':'neutral';
  const rarity=c.impact>=5?'legendary':c.impact>=4?'rare':c.impact>=3?'uncommon':'common';

  const card=document.getElementById('card');
  card.className='card '+verdict+(rarity==='rare'||rarity==='legendary'?' rare':'');

  document.getElementById('cardRarity').textContent=rarity.toUpperCase();
  document.getElementById('cardIcon').textContent=verdict==='evil'?'👁':verdict==='good'?'🛡':'⚖';
  document.getElementById('cardName').textContent=c.title||c.raw_title;
  document.getElementById('cardTriple').textContent=`${PICKS.who} → ${PICKS.what} → ${PICKS.whom}`;
  document.getElementById('cardQuote').textContent=c.article_quote?`"${trunc(c.article_quote,50)}"`:'';

  const ab=genAbility(PICKS,evl);
  document.getElementById('abilityName').textContent='⚡ '+ab.name;
  document.getElementById('abilityText').textContent=ab.text;

  document.getElementById('statAtk').textContent=(c.impact||1)*2+Math.floor(Math.random()*2);
  document.getElementById('statDef').textContent=(c.impact||1)+Math.floor(Math.random()*3);
  document.getElementById('statEvl').textContent=evl;

  document.getElementById('scratcher').classList.remove('revealed');
  document.getElementById('cardOverlay').classList.add('active');
}

function genAbility(p,evl){
  const t={
    evil:[{name:'MASS SCRAPE',text:`Collect all ${p.whom}. No opt-out.`},{name:'AUTO-REJECT',text:`Deny ${p.whom} instantly.`},{name:'SILENT WATCH',text:`Monitor ${p.whom} indefinitely.`}],
    good:[{name:'EARLY WARNING',text:`Alert ${p.whom} before harm.`},{name:'OPT-OUT',text:`${p.whom} can leave.`}],
    neutral:[{name:'EFFICIENCY',text:`Process ${p.whom} faster.`},{name:'SCALE',text:`Handle millions of ${p.whom}.`}]
  };
  const l=t[evl>=5?'evil':evl<=2?'good':'neutral'];
  return l[Math.floor(Math.random()*l.length)];
}

function closeCard(){document.getElementById('cardOverlay').classList.remove('active');goHome()}

// Utils
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
const trunc=(s,n)=>(!s||s.length<=n)?(s||''):s.slice(0,n).trim()+'…';
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('active');setTimeout(()=>t.classList.remove('active'),2500)};

// Init
async function init(){
  try{
    const r=await fetch(API+'search-cases',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},body:'{}'});
    const d=await r.json();
    CASES=(d.results||[]).filter(c=>c.extraction);
    renderCases(CASES);
  }catch(e){toast('Load failed')}
}
init();
</script>
</body>
</html>
